<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MS Norröna — onboard prebookings</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* ==========================================================
   SMYRIL LINE — Sherpa Blue #004A59 · Cutty Sark #5B7581 · white
   ========================================================== */
:root{
  /* ---- COLOURS — change these six and the whole page follows ---- */
  --brass:#E2A64B;       /* accent: active day, buttons, bar ends, flags */
  --paper:#0B1723;       /* page background                             */
  --card:#122130;        /* panels and cards                            */
  --ink:#E9F1F7;         /* headings and the big numbers                */
  --cutty:#90A9BC;       /* labels and secondary text                   */
  --blue:#3E7FA8;        /* the cool end of the seating bars            */
  /* -------------------------------------------------------------- */

  --brass-deep:#C98A2E;
  --brass-soft:rgba(226,166,75,.13);
  --brass-lit:#F0C97D;
  --card-2:#16293C;
  --line:#1E374C;
  --line-soft:#182B3D;
  --faint:#6B8798;
  --good:#56D6A0;
  --warn:#FF8A6B;
  --sans:'Plus Jakarta Sans','Segoe UI',system-ui,-apple-system,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,'SF Mono',Menlo,monospace;
  --r:16px;
  --shadow:0 1px 2px rgba(0,0,0,.25), 0 16px 36px -24px rgba(0,0,0,.7);
  --shadow-lift:0 2px 6px rgba(0,0,0,.3), 0 22px 48px -26px rgba(0,0,0,.8);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--sans);font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;
}
.shell{max-width:1160px;margin:0 auto;padding:0 24px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2.5px solid var(--brass);outline-offset:2px;border-radius:4px}
.hidden{display:none !important}

/* ---------------- hero ---------------- */
.hero{
  position:relative;color:#fff;padding:26px 0 116px;overflow:hidden;
  background:linear-gradient(150deg,#0A1826 0%, #12293D 52%, #0D2033 100%);
}
.hero::after{
  content:'';position:absolute;inset:0;opacity:.5;pointer-events:none;
  background:radial-gradient(820px 360px at 84% -14%, rgba(226,166,75,.20), transparent 68%);
}
.hero .shell{position:relative;z-index:2}
.masthead{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.brandmark{display:flex;align-items:center;gap:13px;min-height:44px}
.brandmark img{max-height:44px;max-width:190px;display:block}
.falcon{width:38px;height:38px;fill:#fff;flex:none}
.wordmark{font-weight:800;font-size:15px;letter-spacing:.02em;line-height:1.15}
.wordmark span{display:block;font-weight:500;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:rgba(255,255,255,.62)}
.wordmark.with-logo{font-size:0;padding-left:13px;margin-left:2px;border-left:1px solid rgba(255,255,255,.28)}
.wordmark.with-logo span{font-size:11px;color:rgba(255,255,255,.8);white-space:nowrap}
/* If the official logo is dark and hard to see on the blue header,
   uncomment the next line to render it in white.                  */
/* .brandmark img{filter:brightness(0) invert(1)} */
.masthead .acts{display:flex;gap:9px;flex-wrap:wrap}

.hero-copy{margin-top:52px;max-width:640px}
.eyebrow{
  font-size:11px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  color:rgba(255,255,255,.66);margin:0 0 12px;
}
.hero-copy h1{
  font-size:clamp(34px,5.2vw,52px);font-weight:800;letter-spacing:-.03em;line-height:1.03;margin:0;
}
.hero-copy h1 em{font-style:normal;color:var(--brass-lit)}
.lede{margin:16px 0 0;font-size:16.5px;line-height:1.6;color:rgba(255,255,255,.8);max-width:520px}
.waves{color:var(--paper);position:absolute;left:0;right:0;bottom:-1px;width:100%;height:150px;display:block;z-index:1}

/* ---------------- buttons ---------------- */
.btn{
  display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13.5px;
  padding:10px 18px;border-radius:999px;border:1.5px solid transparent;white-space:nowrap;
  transition:background .18s,border-color .18s,color .18s,transform .18s,box-shadow .18s;
}
.btn:active{transform:translateY(1px)}
.on-dark .btn{border-color:rgba(255,255,255,.3);color:#fff}
.on-dark .btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.5)}
.on-dark .btn.primary{background:var(--brass);color:#0B1723;border-color:var(--brass);font-weight:700}
.on-dark .btn.primary:hover{background:var(--brass-lit);border-color:var(--brass-lit)}
.btn.solid{background:var(--brass);color:#0B1723;font-weight:700}
.btn.solid:hover{background:var(--brass-lit);box-shadow:var(--shadow)}
.btn.ghost{border-color:var(--line);background:var(--card);color:var(--brass)}
.btn.ghost:hover{border-color:var(--brass);background:var(--brass-soft)}

/* ---------------- import ---------------- */
#dropzone{margin:-72px auto 70px;max-width:760px;position:relative;z-index:3}
.dropcard{
  background:var(--card);border-radius:24px;box-shadow:var(--shadow);padding:44px 40px;text-align:center;
  border:1px solid var(--line);
}
.dropcard.hot{border-color:var(--brass);box-shadow:0 0 0 4px rgba(226,166,75,.16),var(--shadow-lift)}
.dropcard h2{font-size:23px;font-weight:800;letter-spacing:-.02em;margin:18px 0 8px}
.dropcard p{color:var(--cutty);max-width:460px;margin:0 auto 24px;font-size:14.5px}
.dropicon{
  width:60px;height:60px;border-radius:18px;margin:0 auto;display:grid;place-items:center;
  background:var(--brass-soft);color:var(--brass);
}
.steps{
  margin-top:34px;text-align:left;border-top:1px solid var(--line-soft);padding-top:26px;
  display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:22px 28px;
}
.step .n{
  font-family:var(--mono);font-size:12px;color:var(--brass);background:var(--brass-soft);
  width:26px;height:26px;border-radius:9px;display:grid;place-items:center;margin-bottom:9px;font-weight:600;
}
.step p{margin:0;font-size:13px;color:var(--cutty);line-height:1.5;max-width:none}
.msg{margin-top:20px;font-size:13.5px;color:var(--cutty);font-family:var(--mono)}
.msg.bad{color:var(--warn)}

/* ---------------- day rail ---------------- */
.overlap{margin-top:-76px;position:relative;z-index:3}
.railcard{
  background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);
  padding:16px 18px;
}
.railhead{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:0 4px 12px}
.railhead .t{font-size:11px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--cutty)}
.railwrap{position:relative}
.railwrap::after{
  content:'';position:absolute;top:0;right:0;width:44px;height:100%;pointer-events:none;
  background:linear-gradient(90deg,rgba(18,33,48,0),var(--card) 78%);border-radius:0 14px 14px 0;
}
.rail{display:flex;gap:9px;overflow-x:auto;padding:2px 44px 2px 2px;scroll-snap-type:x proximity}
.rail::-webkit-scrollbar{height:6px}
.rail::-webkit-scrollbar-thumb{background:var(--line);border-radius:99px}
.daychip{
  flex:none;min-width:96px;padding:11px 14px 12px;border-radius:14px;text-align:left;scroll-snap-align:start;
  border:1.5px solid var(--line);background:var(--card-2);transition:all .18s;
}
.daychip:hover{border-color:var(--brass);background:var(--brass-soft)}
.daychip .dow{font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--cutty)}
.daychip .dnum{font-family:var(--mono);font-size:17px;font-weight:500;margin-top:1px;letter-spacing:-.02em}
.daychip .dcov{font-size:12px;color:var(--cutty);margin-top:3px}
.daychip[aria-pressed="true"]{background:var(--brass);border-color:var(--brass);color:#0B1723;box-shadow:var(--shadow)}
.daychip[aria-pressed="true"] .dow{color:rgba(11,23,35,.68)}
.daychip[aria-pressed="true"] .dcov{color:rgba(11,23,35,.82);font-weight:700}

/* ---------------- day header + kpis ---------------- */
.dayhead{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px;margin:44px 0 20px}
.dayhead h2{font-size:clamp(25px,3.6vw,34px);font-weight:800;letter-spacing:-.03em;margin:4px 0 0}
.dayhead .meta{font-family:var(--mono);font-size:12.5px;color:var(--cutty)}
.eyebrow.dark{color:var(--brass)}

.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px}
.kpi .lbl{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cutty)}
.kpi .val{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.1;margin-top:8px;color:var(--ink)}
.kpi .note{font-size:12.5px;color:var(--cutty);margin-top:3px}
.kpi.hero-kpi{background:linear-gradient(140deg,var(--brass),var(--brass-deep));border-color:transparent}
.kpi.hero-kpi .lbl{color:rgba(11,23,35,.66)}
.kpi.hero-kpi .val{color:#0B1723}
.kpi.hero-kpi .note{color:rgba(11,23,35,.75)}

/* ---------------- filters ---------------- */
.filterbar{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin:32px 0 6px}
.chip{
  font-size:13px;font-weight:600;padding:9px 15px;border-radius:999px;
  border:1.5px solid var(--line);background:var(--card);color:var(--cutty);transition:all .18s;
}
.chip:hover{border-color:var(--brass);color:var(--brass-lit)}
.chip[aria-pressed="true"]{background:var(--brass-soft);border-color:var(--brass);color:var(--brass)}
.search{
  margin-left:auto;display:flex;align-items:center;gap:9px;background:var(--card);
  border:1.5px solid var(--line);border-radius:999px;padding:8px 16px;transition:border-color .18s;
}
.search:focus-within{border-color:var(--brass)}
.search svg{color:var(--cutty);flex:none}
.search input{border:0;background:none;outline:none;font:inherit;font-size:14px;width:220px;color:var(--ink)}
.search input::placeholder{color:var(--faint)}

/* ---------------- service sections ---------------- */
.service{margin-top:46px}
.service-head{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.svc-icon{
  width:40px;height:40px;border-radius:13px;flex:none;display:grid;place-items:center;
  background:var(--brass-soft);color:var(--brass);
}
.service-head h3{font-size:19px;font-weight:800;letter-spacing:-.02em;margin:0}
.service-head .cnt{font-size:13px;color:var(--cutty);margin-top:1px}
.service-head .tot{
  margin-left:auto;text-align:right;font-weight:800;font-size:22px;letter-spacing:-.03em;color:var(--ink);
}
.service-head .tot small{display:block;font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cutty)}

.outletcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--shadow);overflow:hidden;margin-bottom:14px;
}
.outlet-head{
  width:100%;text-align:left;display:flex;align-items:center;gap:13px;padding:15px 20px;
  background:var(--card-2);transition:background .16s;
}
.outlet-head .ohead{flex:1;min-width:0}
.outlet-head .oline{display:flex;align-items:baseline;gap:10px;margin-bottom:8px}
.outlet-head .pills{gap:6px}
.outlet-head .pill{background:rgba(233,241,247,.06)}
.outlet-head .pill.ci{background:rgba(86,214,160,.13)}
.outlet-head .pill.peak{background:var(--brass)}
.outlet-head .dot{align-self:flex-start;margin-top:7px}
.outlet-head:hover{background:#1B3247}
.outletcard.open .outlet-head{border-bottom:1px solid var(--line-soft)}
.outlet-head h4{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-.01em}
.outlet-head .seats{font-size:12.5px;color:var(--cutty)}
.outlet-head .oc{font-family:var(--mono);font-size:13px;color:var(--cutty);white-space:nowrap;text-align:right}
.outlet-head .oc b{color:var(--ink);font-size:19px;font-weight:700;font-family:var(--sans);letter-spacing:-.02em}
.outlet-head .ochev{color:var(--faint);transition:transform .2s;flex:none}
.outletcard.open .outlet-head .ochev{transform:rotate(90deg);color:var(--brass)}
.dot{width:7px;height:7px;border-radius:99px;background:var(--brass);flex:none}

/* the seating row — the thing the team actually reads */
.slot{
  width:100%;display:grid;grid-template-columns:78px 1fr 118px 26px;gap:18px;align-items:center;
  padding:15px 20px;text-align:left;border-bottom:1px solid var(--line-soft);transition:background .16s;
}
.slot:last-of-type{border-bottom:0}
.slot:hover{background:var(--card-2)}
.slot .timechip{
  font-family:var(--mono);font-size:16px;font-weight:600;letter-spacing:-.02em;
  background:var(--brass-soft);color:var(--brass-lit);padding:8px 0;border-radius:11px;text-align:center;
}
.slot[aria-expanded="true"] .timechip{background:var(--brass);color:#0B1723}
.track{height:7px;border-radius:99px;background:var(--line);overflow:hidden;margin-bottom:9px;max-width:420px}
.track span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--brass))}
.pills{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.pill{
  font-size:12px;font-weight:600;color:var(--cutty);background:var(--card-2);
  padding:3px 10px;border-radius:999px;white-space:nowrap;
}
.pill b{color:var(--ink);font-weight:700}
.pill.ci{background:rgba(86,214,160,.12);color:var(--good)}
.pill.peak{background:var(--brass);color:#0B1723;font-weight:700}
.covers{text-align:right}
.covers .n{font-size:32px;font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--ink)}
.covers .u{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cutty);margin-top:3px}
.chev{color:var(--faint);transition:transform .2s;justify-self:end}
.slot[aria-expanded="true"] .chev{transform:rotate(90deg);color:var(--brass)}

/* guest list */
.guests{padding:4px 20px 18px;background:#0E1B28;border-bottom:1px solid var(--line-soft)}
.guests .gh{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--cutty);padding:14px 0 6px}
table{width:100%;border-collapse:collapse;font-size:14px;background:var(--card);border-radius:12px;overflow:hidden}
th{
  text-align:left;font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:var(--cutty);padding:11px 14px;background:var(--card-2);border-bottom:1px solid var(--line);
}
td{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
tr:last-child td{border-bottom:0}
td.name{font-weight:600}
td.num,th.num{text-align:right;font-family:var(--mono)}
td.code{font-family:var(--mono);font-size:12.5px;color:var(--cutty)}
.hit td{background:rgba(226,166,75,.13)}
.ci-badge{font-size:11.5px;font-weight:700;color:var(--good)}

/* legend */
.legend{
  margin:52px 0 0;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:22px 24px;
}
.legend summary{font-size:14px;font-weight:700;color:var(--brass);cursor:pointer;list-style:none;display:flex;align-items:center;gap:9px}
.legend summary::-webkit-details-marker{display:none}
.legend summary::before{content:'?';display:grid;place-items:center;width:22px;height:22px;border-radius:99px;background:var(--brass-soft);font-size:12px}
.legend dl{display:grid;grid-template-columns:130px 1fr;gap:9px 20px;margin:20px 0 0;font-size:14px}
.legend dt{font-weight:700}
.legend dd{margin:0;color:var(--cutty)}
.legend .fine{margin:18px 0 0;font-size:13px;color:var(--cutty);border-top:1px solid var(--line-soft);padding-top:16px}
.empty{text-align:center;color:var(--cutty);padding:50px 0}
footer.sig{margin:56px 0 40px;padding-top:22px;border-top:1px solid var(--line);font-size:12.5px;color:var(--cutty);display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap}

.toast{
  position:fixed;left:50%;bottom:26px;transform:translate(-50%,10px);z-index:20;
  background:var(--brass);color:#0B1723;font-size:13.5px;font-weight:700;padding:12px 22px;border-radius:999px;
  opacity:0;transition:opacity .22s,transform .22s;pointer-events:none;box-shadow:var(--shadow-lift);
}
.toast.show{opacity:1;transform:translate(-50%,0)}
.printline{display:none}

@media (max-width:820px){
  .kpis{grid-template-columns:1fr 1fr}
  .outlet-head{
    display:grid;grid-template-columns:auto 1fr auto;
    grid-template-areas:'dot name total' 'pills pills pills';
    gap:9px 10px;align-items:center;padding:14px 16px;
  }
  .outlet-head .ohead{display:contents}
  .outlet-head .dot{grid-area:dot;align-self:center;margin-top:0}
  .outlet-head .oline{grid-area:name;margin-bottom:0;flex-wrap:wrap;gap:2px 8px}
  .outlet-head .pills{grid-area:pills}
  .outlet-head .oc{grid-area:total}
  .outlet-head .ochev{display:none}
  .slot{grid-template-columns:auto 1fr;grid-template-areas:'time covers' 'meta meta';gap:12px 14px;padding:15px 16px;align-items:center}
  .slot .timechip{grid-area:time;padding:7px 15px;font-size:15px}
  .slot .covers{grid-area:covers}
  .slot .meta{grid-area:meta}
  .track{max-width:none;margin-bottom:10px}
  .chev{display:none}
  .covers .n{font-size:25px}
  .slot .timechip{font-size:14px;padding:7px 0}
  .search{margin-left:0;width:100%}
  .search input{width:100%}
  .shell{padding:0 16px}
  .hero{padding-bottom:96px}
  .legend dl{grid-template-columns:1fr;gap:3px 0}
  .legend dd{margin-bottom:9px}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;scroll-behavior:auto !important}}


/* ---------------- language switch, tabs, analysis ---------------- */
.langswitch{display:inline-flex;border:1.5px solid rgba(255,255,255,.3);border-radius:999px;overflow:hidden}
.langswitch button{
  padding:9px 14px;font-size:12.5px;font-weight:700;letter-spacing:.06em;color:rgba(255,255,255,.72);
  transition:background .16s,color .16s;
}
.langswitch button[aria-pressed="true"]{background:var(--brass);color:#0B1723}
.acts{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;margin:38px 0 -6px;border-bottom:1px solid var(--line)}
.tab{
  padding:12px 18px;font-size:14.5px;font-weight:700;color:var(--cutty);
  border-bottom:2.5px solid transparent;margin-bottom:-1px;transition:color .16s,border-color .16s;
}
.tab:hover{color:var(--ink)}
.tab[aria-pressed="true"]{color:var(--brass);border-bottom-color:var(--brass)}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:22px}
.ctrls{display:flex;flex-wrap:wrap;gap:14px}
.ctrls.filters{margin-top:16px;padding-top:16px;border-top:1px solid var(--line-soft)}
.ctrl{display:flex;flex-direction:column;gap:6px;min-width:170px}
.ctrl.grow{flex:1;min-width:230px}
.ctrl span{font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--cutty)}
.ctrl select,.ctrl input{
  font:inherit;font-size:14px;color:var(--ink);background:var(--card-2);
  border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;width:100%;
}
.ctrl select:focus,.ctrl input:focus{border-color:var(--brass)}
.ctrl option{background:var(--card-2);color:var(--ink)}
.hint{color:var(--cutty);font-size:12.5px;margin:16px 0 0;line-height:1.55}
.hint.pad{margin:14px 2px 0}

.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:22px}
table.an{width:100%;border-collapse:collapse;font-size:14px;background:none}
table.an th{
  position:sticky;top:0;background:var(--card-2);color:var(--cutty);text-align:left;
  font-size:10.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;
  padding:12px 14px;border-bottom:1px solid var(--line);white-space:nowrap;
}
table.an th.s{cursor:pointer;user-select:none}
table.an th.s:hover{color:var(--brass)}
table.an th.num,table.an td.num{text-align:right;font-family:var(--mono)}
table.an td{padding:11px 14px;border-bottom:1px solid var(--line-soft)}
table.an tbody tr:hover td{background:rgba(233,241,247,.03)}
table.an td.lbl{font-weight:600}
table.an td.strong{font-weight:800;font-size:16px;color:var(--ink);font-family:var(--sans)}
table.an td .dim{color:var(--faint)}
table.an tfoot td{border-top:1.5px solid var(--line);border-bottom:0;font-weight:700;background:var(--card-2)}
table.an td.share,table.an th.share{width:158px;min-width:158px}
table.an td.share{display:flex;align-items:center;gap:9px}
table.an td.share i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--cutty);min-width:46px;white-space:nowrap}
.minibar{flex:1;height:7px;border-radius:99px;background:var(--line);overflow:hidden;min-width:52px}
.minibar span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--brass))}
table.an td.empty{padding:34px;text-align:center;color:var(--cutty)}
@media (max-width:820px){
  .tabs{margin-top:26px}
  .ctrl{min-width:100%}
  table.an td.share,table.an th.share{display:none}
}

/* choose which days to print */
.printpanel{position:fixed;inset:0;z-index:70;display:none;place-items:center;background:rgba(6,13,21,.78);backdrop-filter:blur(4px)}
.printpanel.show{display:grid}
.ppcard{
  width:min(620px,92vw);max-height:88vh;overflow:auto;background:var(--card);
  border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow-lift);padding:26px 28px;
}
.ppcard h3{margin:0;font-size:20px;font-weight:800;letter-spacing:-.02em}
.ppcard p.sub2{margin:6px 0 18px;color:var(--cutty);font-size:14px}
.ppdays{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:8px}
.ppday{
  display:flex;align-items:center;gap:9px;padding:10px 12px;border-radius:12px;text-align:left;
  border:1.5px solid var(--line);background:var(--card-2);transition:all .16s;
}
.ppday:hover{border-color:var(--brass)}
.ppday .box{
  width:17px;height:17px;border-radius:5px;border:1.5px solid var(--faint);flex:none;
  display:grid;place-items:center;font-size:11px;color:transparent;
}
.ppday[aria-pressed="true"]{border-color:var(--brass);background:var(--brass-soft)}
.ppday[aria-pressed="true"] .box{background:var(--brass);border-color:var(--brass);color:#0B1723}
.ppday .d{display:block;font-family:var(--mono);font-size:13.5px;line-height:1.2}
.ppday .c{display:block;font-size:11.5px;color:var(--cutty)}
.ppfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:22px;padding-top:18px;border-top:1px solid var(--line)}
.ppfoot .count{color:var(--cutty);font-size:13.5px;margin-right:auto}
.linkbtn{color:var(--brass);font-size:13.5px;font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* drop anywhere on the page */
.dropveil{
  position:fixed;inset:0;z-index:60;display:none;place-items:center;
  background:rgba(6,13,21,.82);backdrop-filter:blur(4px);
}
.dropveil.show{display:grid}
.veilcard{
  border:2.5px dashed rgba(226,166,75,.65);border-radius:24px;padding:44px 56px;text-align:center;color:#fff;
  background:rgba(18,41,61,.65);
}
.veilcard b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;margin:14px 0 6px}
.veilcard span{font-size:15px;color:rgba(255,255,255,.78)}
.dropnote{margin-top:14px;font-size:13px;color:var(--cutty)}

/* ---------------- print: one A4 page per day ---------------- */
.printonly{display:none}
@page{size:A4 portrait;margin:10mm 11mm}
@media print{
  /* the printout stays on white paper — its own light palette */
  :root{
    --ink:#0F2434; --cutty:#5B7581; --line:#D2DFE5; --line-soft:#E7EEF1;
    --card:#fff; --paper:#fff; --brand:#0E3B4C; --brand-050:#EEF4F6;
  }
  html,body{background:#fff;color:var(--ink)}
  body>header.hero,body>section#dropzone,.overlap,.dayhead,.kpis,.filterbar,
  #services,.legend,footer.sig,.toast,.dropveil,.printpanel,.tabs,#viewAnalysis,
  .panel,.tablewrap,#anKpis,.hint,.langswitch{display:none !important}
  .printonly{display:block}
  .shell{max-width:none;padding:0}
  #board{display:block !important}
  #viewBoard{display:none !important}

  .ps{font-size:9.2pt;line-height:1.35;color:var(--ink)}
  .ps-page{break-before:page;break-inside:auto}
  .ps-page:first-child{break-before:auto}

  .ps-head{display:flex;align-items:center;gap:11px;padding-bottom:7px;border-bottom:2.4px solid var(--brand)}
  .ps-head .falcon{width:26px;height:26px;fill:var(--brand)}
  /* Any logo prints as a solid silhouette so a white logo still shows on paper.
     Delete the filter below if your logo is dark and you want it in full colour. */
  .ps-logo{height:26px;width:auto;max-width:150px;filter:brightness(0)}
  .ps-head .who{font-weight:800;font-size:11pt;letter-spacing:-.01em;line-height:1.2}
  .ps-head .who span{display:block;font-weight:600;font-size:7pt;letter-spacing:.2em;text-transform:uppercase;color:var(--cutty)}
  .ps-head .when{margin-left:auto;text-align:right}
  .ps-head .when b{display:block;font-size:13pt;font-weight:800;letter-spacing:-.02em}
  .ps-head .when span{font-size:7.6pt;letter-spacing:.16em;text-transform:uppercase;color:var(--cutty)}

  .ps-kpis{display:flex;gap:6px;margin:9px 0 10px}
  .ps-kpi{flex:1;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
  .ps-kpi.fill{background:var(--brand);border-color:var(--brand);color:#fff}
  .ps-kpi .k{font-size:6.8pt;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--cutty)}
  .ps-kpi.fill .k{color:rgba(255,255,255,.75)}
  .ps-kpi .v{font-size:16pt;font-weight:800;letter-spacing:-.03em;line-height:1.15;color:var(--brand)}
  .ps-kpi.fill .v{color:#fff}
  .ps-kpi .s{font-size:7pt;color:var(--cutty)}
  .ps-kpi.fill .s{color:rgba(255,255,255,.8)}

  /* service = a ruled heading; the outlet is the loud divider */
  .ps-svc{margin-bottom:11px;break-inside:avoid}
  .ps-svc-bar{
    display:flex;align-items:baseline;gap:10px;color:var(--brand);
    padding:0 2px 3px;border-bottom:1.6px solid var(--brand);
    font-size:8.6pt;font-weight:800;letter-spacing:.2em;text-transform:uppercase;
  }
  .ps-svc-bar .r{margin-left:auto;letter-spacing:0;font-size:10.5pt}
  .ps-svc-bar .r small{font-size:6.6pt;letter-spacing:.14em;color:var(--cutty);margin-left:4px}

  /* every outlet is its own fenced block with a solid name bar */
  .ps-out{

  }
  .ps-out + .ps-out{margin-top:8px}
  .ps-out-h{

  .ps-out-h .n{margin-left:auto;font-weight:800;font-size:11pt}

  .ps-out-h .seats{font-size:7pt;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.7);margin-left:9px}
  table.ps-t tbody tr:nth-child(even) td{background:#F4F8FA}

  table.ps-t tr.peak td.big::after{content:' \2605';font-size:7pt;color:var(--cutty)}

    margin-top:9px;padding-top:6px;border-top:1px solid var(--line);
    display:flex;justify-content:space-between;font-size:7.2pt;color:var(--cutty);
  }
}
</style>

<script>
/* ============================================================
   OUTLET NAMES
   Some rows come out of Power BI without an outlet name ("unknown") —
   those are the Skansagarður Buffet, so they are mapped to it below.
   Add a line here for any other name that needs correcting.
   ============================================================ */
const OUTLET_NAMES = {
  'unknown': 'Skansagarður Buffet'
};

/* ============================================================
   COLUMN AND VALUE NAMES
   Codes from the booking system, written out in plain language.
   Any column NOT listed here still works — it just keeps its own
   name from the export.
   ============================================================ */
const COL_LABELS = {
  'CATEGORY_SPECIFICATION_ID': { en:'Guest type',   da:'Gæstetype' },
  'CHECK_IN_STATUS_ID':        { en:'Checked in',   da:'Tjekket ind' },
  'CATEGORYGROUP_ID':          { en:'Category group', da:'Kategorigruppe' },
  'CATEGORY_ID':               { en:'Meal code',    da:'Måltidskode' },
  'BOOKING_ROW_STATUS_ID':     { en:'Booking status', da:'Bookingstatus' }
};
const VALUE_LABELS = {
  'ADL':  { en:'Adults',    da:'Voksne' },
  'YTH':  { en:'Youth',     da:'Unge' },
  'CHD':  { en:'Children',  da:'Børn' },
  'CHKI': { en:'Checked in',da:'Tjekket ind' },
  '—':    { en:'—',         da:'—' }
};

/* ==== BEGIN CORE (parsing + aggregation) ==== */
const SERVICES = [
  { id:'breakfast', name:'Breakfast', from:0,     to:10*60+30 },
  { id:'lunch',     name:'Lunch',     from:10*60+30, to:16*60 },
  { id:'dinner',    name:'Dinner',    from:16*60, to:24*60 }
];

function norm(s){ return String(s == null ? '' : s).trim(); }
function pad(n){ return n < 10 ? '0'+n : ''+n; }

/* Power BI writes a filter description above the real table, so find
   the row that actually carries the column names. */
function findHeaderRow(rows){
  for (let i = 0; i < Math.min(rows.length, 40); i++){
    const r = rows[i] || [];
    for (const c of r){
      if (norm(c).toUpperCase() === 'START_DATE') return i;
    }
  }
  return -1;
}

function columnMap(headerRow){
  const map = {};
  headerRow.forEach((c, i) => { map[norm(c).toUpperCase()] = i; });
  const pick = (...names) => {
    for (const n of names) if (map[n] !== undefined) return map[n];
    return -1;
  };
  return {
    when:    pick('START_DATE','STARTDATE','DATE'),
    outlet:  pick('NAME','OUTLET'),
    code:    pick('BOOKINGCODE','BOOKING_CODE'),
    guest:   pick('BOOKINGLABLE','BOOKINGLABEL','GUEST'),
    pax:     pick('CATEGORY_SPECIFICATION_ID','PAXTYPE'),
    qty:     pick('QTY','QUANTITY'),
    booking: pick('BOOKING_ID','BOOKINGID'),
    cat:     pick('CATEGORY_ID','CATEGORYID'),
    checkin: pick('CHECK_IN_STATUS_ID','CHECKINSTATUS')
  };
}

/* Accepts a JS Date, an Excel serial number, or the strings Power BI
   writes: "06-08-2026 17:30:00" (DD-MM-YYYY) and "2026-08-06 17:30:00". */
function toDate(v){
  /* Excel stores times as fractions, so a seating saved as 17:45 can come
     back as 17:44:59.99 — every timestamp is rounded to the whole minute. */
  const round = d => (d && !isNaN(d)) ? new Date(Math.round(d.getTime() / 60000) * 60000) : null;
  if (v instanceof Date) return round(v);
  if (typeof v === 'number' && isFinite(v)){
    const d = new Date(Math.round((v - 25569) * 86400 * 1000));
    return new Date(d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate(), d.getUTCHours(), d.getUTCMinutes());
  }
  const s = norm(v);
  if (!s) return null;
  let m = s.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[3], +m[2]-1, +m[1], +(m[4]||0), +(m[5]||0));
  m = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})(?:[ T](\d{1,2}):(\d{2})(?::(\d{2}))?)?/);
  if (m) return new Date(+m[1], +m[2]-1, +m[3], +(m[4]||0), +(m[5]||0));
  return round(new Date(s));
}

function cleanGuest(v){
  let s = norm(v).replace(/\s*-\s*$/, '');
  if (!s) return '—';
  const parts = s.split(',');
  if (parts.length === 2) s = parts[1].trim() + ' ' + parts[0].trim();
  return s.replace(/\s+/g, ' ');
}

function outletName(raw){
  const s = norm(raw) || 'unknown';
  return OUTLET_NAMES[s] || OUTLET_NAMES[s.toLowerCase()] || s;
}

function serviceOf(minutes){
  for (const s of SERVICES) if (minutes >= s.from && minutes < s.to) return s;
  return SERVICES[SERVICES.length - 1];
}

/* rows (array of arrays) -> { days: [...], rowCount, skipped } */
/* Columns the board already understands. Anything else in the export is
   offered automatically as an extra dimension to group and filter by. */
const KNOWN_COLS = ['START_DATE','STARTDATE','DATE','NAME','OUTLET','BOOKINGCODE','BOOKING_CODE',
  'BOOKINGLABLE','BOOKINGLABEL','GUEST','QTY','QUANTITY','BOOKING_ID','BOOKINGID'];

function buildModel(rows){
  const hi = findHeaderRow(rows);
  if (hi < 0) throw new Error('No START_DATE column found. Export the table with its column headers and try again.');
  const header = rows[hi].map(c => norm(c));
  const col = columnMap(rows[hi]);
  if (col.when < 0 || col.qty < 0) throw new Error('The export is missing START_DATE or Qty.');

  const extraCols = header
    .map((name, i) => ({ name, i }))
    .filter(c => c.name && !KNOWN_COLS.includes(c.name.toUpperCase()));

  const days = new Map();
  const facts = [];
  let used = 0, skipped = 0;

  for (let i = hi + 1; i < rows.length; i++){
    const r = rows[i] || [];
    const when = toDate(r[col.when]);
    const qty = parseInt(norm(r[col.qty]), 10);
    if (!when || !isFinite(qty)) { if (r.some(c => norm(c))) skipped++; continue; }

    const dateKey = when.getFullYear() + '-' + pad(when.getMonth()+1) + '-' + pad(when.getDate());
    const minutes = when.getHours()*60 + when.getMinutes();
    const timeKey = pad(when.getHours()) + ':' + pad(when.getMinutes());
    const svc = serviceOf(minutes);
    const outlet = outletName(r[col.outlet]);
    const paxType = (norm(r[col.pax]) || 'ADL').toUpperCase();
    const checkedIn = norm(r[col.checkin]).toUpperCase() === 'CHKI';
    const bookingId = norm(r[col.booking]) || norm(r[col.code]) || ('row' + i);

    if (!days.has(dateKey)) days.set(dateKey, { key:dateKey, date:new Date(when.getFullYear(), when.getMonth(), when.getDate()), covers:0, bookings:new Set(), slots:new Map() });
    const day = days.get(dateKey);

    const slotKey = svc.id + '|' + outlet + '|' + timeKey;
    if (!day.slots.has(slotKey)) day.slots.set(slotKey, {
      key:slotKey, service:svc, outlet, time:timeKey, minutes,
      covers:0, checkedIn:0, mix:{}, guests:new Map()
    });
    const slot = day.slots.get(slotKey);

    slot.covers += qty;
    if (checkedIn) slot.checkedIn += qty;
    slot.mix[paxType] = (slot.mix[paxType] || 0) + qty;
    day.covers += qty;
    day.bookings.add(bookingId);

    if (!slot.guests.has(bookingId)) slot.guests.set(bookingId, {
      id:bookingId, code:norm(r[col.code]) || bookingId, name:cleanGuest(r[col.guest]),
      pax:0, mix:{}, checkedIn:false, cat:norm(r[col.cat])
    });
    const g = slot.guests.get(bookingId);
    g.pax += qty;
    g.mix[paxType] = (g.mix[paxType] || 0) + qty;
    if (checkedIn) g.checkedIn = true;

    const fact = {
      dateKey, weekday: when.getDay(), time: timeKey, service: svc.id,
      outlet, qty, bookingId, checkedIn,
      guest: cleanGuest(r[col.guest]), code: norm(r[col.code])
    };
    extraCols.forEach(c => { fact['x' + c.i] = norm(r[c.i]) || '—'; });
    facts.push(fact);
    used++;
  }

  const out = [...days.values()].sort((a,b) => a.date - b.date).map(day => {
    const slots = [...day.slots.values()].sort((a,b) => a.minutes - b.minutes || a.outlet.localeCompare(b.outlet));
    slots.forEach(s => { s.guests = [...s.guests.values()].sort((a,b) => b.pax - a.pax || a.name.localeCompare(b.name)); });
    const peak = slots.reduce((m,s) => Math.max(m, s.covers), 0);
    const byService = SERVICES.map(svc => {
      const mine = slots.filter(s => s.service.id === svc.id);
      const outlets = [];
      mine.forEach(s => {
        let o = outlets.find(x => x.name === s.outlet);
        if (!o) outlets.push(o = { name:s.outlet, covers:0, slots:[] });
        o.covers += s.covers; o.slots.push(s);
      });
      outlets.sort((a,b) => b.covers - a.covers);
      return { ...svc, outlets, covers: mine.reduce((n,s) => n + s.covers, 0), seatings: mine.length };
    }).filter(s => s.outlets.length);
    return {
      key:day.key, date:day.date, covers:day.covers,
      bookings:day.bookings.size, seatings:slots.length,
      peak, peakSlot: slots.find(s => s.covers === peak) || null,
      outlets:[...new Set(slots.map(s => s.outlet))].sort(),
      byService
    };
  });

  /* A column is worth offering as a dimension when it has more than one
     value and few enough of them to make a readable breakdown.          */
  const dims = [
    { key:'outlet',  label:'Outlet',      labelDa:'Udsalgssted' },
    { key:'service', label:'Meal',        labelDa:'Måltid' },
    { key:'time',    label:'Seating time',labelDa:'Sædetid' },
    { key:'dateKey', label:'Date',        labelDa:'Dato' },
    { key:'weekday', label:'Weekday',     labelDa:'Ugedag' }
  ];
  extraCols.forEach(c => {
    const key = 'x' + c.i;
    const vals = new Set();
    for (const f of facts){ vals.add(f[key]); if (vals.size > 60) break; }
    if (vals.size > 1 && vals.size <= 60) dims.push({ key, label: c.name, labelDa: c.name, fromFile: true });
  });

  return { days: out, rowCount: used, skipped, facts, dims };
}
/* ==== END CORE ==== */

const tf = (k, vals) => String(T(k)).replace(/\{(\w+)\}/g, (m,p) => vals[p] !== undefined ? vals[p] : m);

const $ = id => document.getElementById(id);
const fmt = n => Number(n).toLocaleString(STR[LANG].locale);
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function longDate(d){
  return LANG === 'da'
    ? `${T('weekdays')[d.getDay()]} ${d.getDate()}. ${T('months')[d.getMonth()]} ${d.getFullYear()}`
    : `${T('weekdays')[d.getDay()]} ${d.getDate()} ${T('monthsShort')[d.getMonth()]} ${d.getFullYear()}`;
}
function toast(msg){
  const el = $('toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => el.classList.remove('show'), 2600);
}
function colLabel(dim){
  if (!dim.fromFile) return LANG === 'da' ? dim.labelDa : dim.label;
  const m = COL_LABELS[dim.label.toUpperCase()];
  return m ? m[LANG] : dim.label;
}
function valLabel(dim, v){
  if (dim.key === 'service') return T(v);
  if (dim.key === 'weekday') return T('weekdays')[v];
  const m = VALUE_LABELS[v];
  return m ? m[LANG] : String(v);
}

function setLogo(src, permanent){
  const img = $('brandLogo'); if (!img) return;
  img.onload = () => {
    img.classList.remove('hidden');
    const f = $('falconMark'); if (f) f.remove();
    $('wordmark').classList.add('with-logo');
    if (!permanent) toast(T('logoSet'));
  };

(function loadLogo(i = 0){
  const img = $('brandLogo'); if (!img) return;
  if (LOGO_DATA_URL) return setLogo(LOGO_DATA_URL, true);
  if (i >= LOGO_SOURCES.length) return;
  img.onerror = () => loadLogo(i + 1);
  setLogo(LOGO_SOURCES[i], true);
})();

/* ---------------- day board ---------------- */
function mixPills(mix, cls){
  const order = ['ADL','YTH','CHD'];
  const keys = [...new Set([...order.filter(k => mix[k]), ...Object.keys(mix)])];
  return keys.map(k => {
    const lbl = VALUE_LABELS[k] ? VALUE_LABELS[k][LANG] : k;
    return `<span class="pill ${cls||''}">${esc(lbl)} <b>${mix[k]}</b></span>`;
  }).join('');
}
function mixPlain(mix){
  const order = ['ADL','YTH','CHD'];
  const keys = [...new Set([...order.filter(k => mix[k]), ...Object.keys(mix)])];
  return keys.map(k => k + ' ' + mix[k]).join(' · ');
}
function matches(g, q){
  return !q || g.name.toLowerCase().includes(q) || String(g.code).toLowerCase().includes(q);
}
function outletKeys(day){
  const keys = [];
  day.byService.forEach(svc => svc.outlets.forEach(o => {
    if (outletFilter === 'all' || o.name === outletFilter) keys.push(`${day.key}|${svc.id}|${o.name}`);
  }));
  return keys;
}
function allOutletsOpen(day){
  const keys = outletKeys(day);
  return keys.length > 0 && keys.every(k => openOutlets.has(k));
}
function toggleAll(){
  const day = MODEL.days[dayIndex], keys = outletKeys(day);
  if (allOutletsOpen(day)) keys.forEach(k => openOutlets.delete(k));
  else keys.forEach(k => openOutlets.add(k));
  render();
}

  const rows = slot.guests.map(g => `

      <td class="name">${esc(g.name)}</td>
      <td class="code">${esc(g.code)}</td>
      <td class="num">${g.pax}</td>
      <td class="code">${mixPlain(g.mix)}</td>
      <td>${g.checkedIn ? `<span class="ci-badge">${T('checkedInBadge')}</span>` : ''}</td>
    </tr>`).join('');
  return `<div class="guests">
    <div class="gh">${T('guestList')} · ${slot.time} · ${esc(slot.outlet)}</div>
    <table>
      <thead><tr><th>${T('thGuest')}</th><th>${T('thBooking')}</th><th class="num">${T('thPax')}</th><th>${T('thMix')}</th><th>${T('thDoor')}</th></tr></thead>

    + `<button class="chip" id="expandAll">${allOutletsOpen(day) ? T('collapseAll') : T('expandAll')}</button>`
    + `<label class="search">
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
         <input id="q" type="search" placeholder="${T('searchGuest')}" value="${esc(query)}" aria-label="${T('searchGuest')}">
       </label>`;

  const q = query.trim().toLowerCase();
  let html = '';
  day.byService.forEach(svc => {
    const outlets = svc.outlets.filter(o => outletFilter === 'all' || o.name === outletFilter);
    if (!outlets.length) return;
    const covers = outlets.reduce((n,o) => n + o.covers, 0);
    const seatings = outlets.reduce((n,o) => n + o.slots.length, 0);
    html += `<section class="service">
      <div class="service-head">

        <div>
          <h3>${T(svc.id)}</h3>
          <div class="cnt">${seatings} ${plural(seatings,'seating','seatings')} · ${outlets.length} ${plural(outlets.length,'outlet','outlets')}</div>
        </div>
        <div class="tot"><small>${T('prebookedCaps')}</small>${fmt(covers)}</div>
      </div>`;
    outlets.forEach(o => {
      const okey = `${day.key}|${svc.id}|${o.name}`;
      const oOpen = openOutlets.has(okey) || (!!q && o.slots.some(s => s.guests.some(g => matches(g, q))));
      const oMix = {}, oBookings = new Set();
      let oCheckedIn = 0;
      o.slots.forEach(s => {
        Object.entries(s.mix).forEach(([k,v]) => { oMix[k] = (oMix[k]||0) + v; });
        s.guests.forEach(g => oBookings.add(g.id));
        oCheckedIn += s.checkedIn;
      });
      html += `<div class="outletcard ${oOpen?'open':''}">
        <button class="outlet-head" data-out="${esc(okey)}" aria-expanded="${oOpen}">
          <span class="dot"></span>
          <span class="ohead">
            <span class="oline"><h4>${esc(o.name)}</h4><span class="seats">${o.slots.length} ${plural(o.slots.length,'seating','seatings')}</span></span>
            <span class="pills">
              ${mixPills(oMix)}
              <span class="pill">${oBookings.size} ${plural(oBookings.size,'booking','bookings')}</span>
              ${oCheckedIn ? `<span class="pill ci">${oCheckedIn} ${T('checkedIn')}</span>` : ''}
              ${o.slots.some(s => s.covers===day.peak) ? `<span class="pill peak">${T('busiest')}</span>` : ''}
            </span>
          </span>
          <span class="oc"><b>${fmt(o.covers)}</b> ${T('prebooked')}</span>
          <svg class="ochev" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
        </button>`;
      if (oOpen) o.slots.forEach(s => {
        const pct = day.peak ? Math.max(5, Math.round(s.covers / day.peak * 100)) : 0;
        const open = openSlots.has(s.key) || (!!q && s.guests.some(g => matches(g, q)));
        html += `<button class="slot" data-slot="${esc(s.key)}" aria-expanded="${open}">
            <div class="timechip">${s.time}</div>
            <div class="meta">
              <div class="track"><span style="width:${pct}%"></span></div>
              <div class="pills">
                ${mixPills(s.mix)}
                <span class="pill">${s.guests.length} ${plural(s.guests.length,'booking','bookings')}</span>
                ${s.checkedIn ? `<span class="pill ci">${s.checkedIn} ${T('checkedIn')}</span>` : ''}
                ${s.covers===day.peak ? `<span class="pill peak">${T('busiest')}</span>` : ''}
              </div>
            </div>
            <div class="covers"><div class="n">${fmt(s.covers)}</div><div class="u">${T('prebooked')}</div></div>
            <svg class="chev" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
          </button>`;
        if (open) html += guestTable(s, q);
      });
      html += `</div>`;
    });
    html += `</section>`;
  });

  $('services').innerHTML = html || `<p class="empty">${T('nothing')}</p>`;
  $('footMeta').textContent = tf('footMeta',{ d:MODEL.days.length, n:fmt(MODEL.days.reduce((n,d)=>n+d.covers,0)) });
  document.querySelectorAll('.tab').forEach(b => b.setAttribute('aria-pressed', b.dataset.tab === tab));
  $('viewBoard').classList.toggle('hidden', tab !== 'board');
  $('viewAnalysis').classList.toggle('hidden', tab !== 'analysis');
  buildPrintSheet([day]);
  if (tab === 'analysis') renderAnalysis();
}

/* ---------------- analysis ---------------- */
function dimByKey(k){ return MODEL.dims.find(d => d.key === k); }

function buildAnalysisControls(){
  $('anScope').innerHTML = `<option value="day">${T('thisDay')}</option><option value="all">${T('allDaysScope')}</option>`;
  $('anScope').value = anScope;
  const opts = MODEL.dims.map(d => `<option value="${d.key}">${esc(colLabel(d))}</option>`).join('');
  $('anDim').innerHTML = opts; $('anDim').value = anDim;
  $('anSplit').innerHTML = `<option value="">${T('splitNone')}</option>` + opts; $('anSplit').value = anSplit;
  $('anHint').textContent = T('anHint');
  $('anCols').textContent = tf('anCols',{ cols: MODEL.dims.map(colLabel).join(' · ') });

  $('anFilters').innerHTML = MODEL.dims.map(d => {
    const vals = [...new Set(MODEL.facts.map(f => f[d.key]))]
      .sort((a,b) => String(valLabel(d,a)).localeCompare(String(valLabel(d,b)), STR[LANG].locale));
    if (vals.length > 40) return '';
    return `<label class="ctrl"><span>${esc(colLabel(d))}</span>
      <select data-filter="${d.key}">
        <option value="">${T('all')}</option>
        ${vals.map(v => `<option value="${esc(v)}" ${anFilters[d.key]===String(v)?'selected':''}>${esc(valLabel(d,v))}</option>`).join('')}
      </select></label>`;
  }).join('');
}

function analysisFacts(){
  const day = MODEL.days[dayIndex];
  const q = anQuery.trim().toLowerCase();
  return MODEL.facts.filter(f => {
    if (anScope === 'day' && f.dateKey !== day.key) return false;
    for (const k in anFilters){
      if (anFilters[k] !== '' && String(f[k]) !== anFilters[k]) return false;
    }
    if (q){
      let hit = false;
      for (const k in f){
        if (String(f[k]).toLowerCase().includes(q)){ hit = true; break; }
      }
      if (!hit) return false;
    }
    return true;
  });
}

function renderAnalysis(){
  const dim = dimByKey(anDim) || MODEL.dims[0];
  const split = anSplit ? dimByKey(anSplit) : null;
  const facts = analysisFacts();

  const groups = new Map();
  const splitVals = new Map();
  facts.forEach(f => {
    const gv = f[dim.key];
    if (!groups.has(gv)) groups.set(gv, { key:gv, total:0, bookings:new Set(), checked:0, cells:new Map() });
    const g = groups.get(gv);
    g.total += f.qty;
    g.bookings.add(f.bookingId);
    if (f.checkedIn) g.checked += f.qty;
    if (split){
      const sv = f[split.key];
      g.cells.set(sv, (g.cells.get(sv)||0) + f.qty);
      splitVals.set(sv, (splitVals.get(sv)||0) + f.qty);
    }
  });

  const grand = facts.reduce((n,f) => n + f.qty, 0);
  const grandBookings = new Set(facts.map(f => f.bookingId)).size;
  const grandChecked = facts.reduce((n,f) => n + (f.checkedIn ? f.qty : 0), 0);

  $('anKpis').innerHTML = `
    <div class="kpi hero-kpi"><div class="lbl">${T('anTotal')}</div><div class="val">${fmt(grand)}</div><div class="note">${fmt(facts.length)} ${LANG==='da'?'rækker':'rows'}</div></div>
    <div class="kpi"><div class="lbl">${T('anBookings')}</div><div class="val">${fmt(grandBookings)}</div><div class="note">${tf('kpiBookingsNote',{n:(grand/Math.max(grandBookings,1)).toFixed(1)})}</div></div>
    <div class="kpi"><div class="lbl">${T('anCheck')}</div><div class="val">${grand ? Math.round(grandChecked/grand*100) : 0}%</div><div class="note">${fmt(grandChecked)} / ${fmt(grand)}</div></div>
    <div class="kpi"><div class="lbl">${esc(colLabel(dim))}</div><div class="val">${fmt(groups.size)}</div><div class="note">${tf('anRows',{n:groups.size})}</div></div>`;

  const cols = split
    ? [...splitVals.entries()].sort((a,b) => b[1]-a[1]).slice(0,10).map(e => e[0])
    : [];

  let rows = [...groups.values()].map(g => ({
    key:g.key,
    label:valLabel(dim, g.key),
    total:g.total,
    bookings:g.bookings.size,
    avg: g.bookings.size ? g.total/g.bookings.size : 0,
    check: g.total ? g.checked/g.total : 0,
    cells:g.cells
  }));
  const sc = anSort.col, dir = anSort.dir;
  rows.sort((a,b) => {
    let va, vb;
    if (sc === 'label'){ va = String(a.label); vb = String(b.label); return va.localeCompare(vb, STR[LANG].locale) * dir; }
    if (sc.startsWith('cell:')){ const k = sc.slice(5); va = a.cells.get(k)||0; vb = b.cells.get(k)||0; }
    else { va = a[sc]; vb = b[sc]; }
    return (va - vb) * dir;
  });

  const max = Math.max(1, ...rows.map(r => r.total));
  const arrow = c => anSort.col === c ? (anSort.dir === 1 ? ' ▲' : ' ▼') : '';

  const head = `<thead><tr>
      <th class="s" data-sort="label">${esc(colLabel(dim))}${arrow('label')}</th>
      ${cols.map(c => `<th class="s num" data-sort="cell:${esc(c)}">${esc(valLabel(split,c))}${arrow('cell:'+c)}</th>`).join('')}
      <th class="s num" data-sort="bookings">${T('anBookings')}${arrow('bookings')}</th>
      <th class="s num" data-sort="avg">${T('anAvg')}${arrow('avg')}</th>
      <th class="s num" data-sort="check">${T('anCheck')}${arrow('check')}</th>
      <th class="s num strong" data-sort="total">${T('anTotal')}${arrow('total')}</th>
      <th class="share">${T('anShare')}</th>
    </tr></thead>`;

  const body = rows.map(r => `<tr>
      <td class="lbl">${esc(r.label)}</td>
      ${cols.map(c => `<td class="num">${r.cells.get(c) ? fmt(r.cells.get(c)) : '<span class="dim">–</span>'}</td>`).join('')}
      <td class="num">${fmt(r.bookings)}</td>
      <td class="num">${r.avg.toFixed(1)}</td>
      <td class="num">${Math.round(r.check*100)}%</td>
      <td class="num strong">${fmt(r.total)}</td>
      <td class="share"><span class="minibar"><span style="width:${Math.round(r.total/max*100)}%"></span></span><i>${grand ? (r.total/grand*100).toFixed(1) : 0}%</i></td>
    </tr>`).join('');

  const foot = `<tfoot><tr>
      <td class="lbl">${T('anTotalRow')}</td>
      ${cols.map(c => `<td class="num">${fmt(splitVals.get(c)||0)}</td>`).join('')}
      <td class="num">${fmt(grandBookings)}</td>
      <td class="num">${(grand/Math.max(grandBookings,1)).toFixed(1)}</td>
      <td class="num">${grand ? Math.round(grandChecked/grand*100) : 0}%</td>
      <td class="num strong">${fmt(grand)}</td><td></td>
    </tr></tfoot>`;

  $('anTable').innerHTML = rows.length ? head + `<tbody>${body}</tbody>` + foot
    : `<tbody><tr><td class="empty">${T('nothing')}</td></tr></tbody>`;
}

function copyTable(){
  const tbl = $('anTable');
  const lines = [...tbl.querySelectorAll('tr')].map(tr =>
    [...tr.children].map(td => td.textContent.replace(/\s+/g,' ').trim()).join('\t'));
  navigator.clipboard.writeText(lines.join('\n')).then(
    () => toast(T('copiedTable')), () => toast(T('copyFail')));
}

function buildPrintSheet(days){ $('printsheet').innerHTML = days.map(printPage).join(''); }

function openPrintPanel(){

}
function drawPrintPanel(){
  $('ppdays').innerHTML = MODEL.days.map((d,i) => `

/* ---------------- events ---------------- */
document.addEventListener('click', e => {
  const lang = e.target.closest('[data-lang]');
  if (lang){ setLang(lang.dataset.lang); return; }
  const tb = e.target.closest('.tab');
  if (tb){ tab = tb.dataset.tab; render(); return; }
  const pp = e.target.closest('.ppday');
  if (pp){
    const i = +pp.dataset.pp;
    printPick.has(i) ? printPick.delete(i) : printPick.add(i);
    drawPrintPanel(); return;
  }
  const chip = e.target.closest('.daychip');
  if (chip){ dayIndex = +chip.dataset.day; openSlots.clear(); openOutlets.clear(); render(); return; }
  if (e.target.closest('#expandAll')){ toggleAll(); return; }
  const f = e.target.closest('.chip');
  if (f && f.dataset.outlet !== undefined){ outletFilter = f.dataset.outlet; render(); return; }
  const oh = e.target.closest('.outlet-head');
  if (oh){
    const k = oh.dataset.out;
    openOutlets.has(k) ? openOutlets.delete(k) : openOutlets.add(k);
    render(); return;
  }
  const slot = e.target.closest('.slot');
  if (slot){
    const k = slot.dataset.slot;
    openSlots.has(k) ? openSlots.delete(k) : openSlots.add(k);
    render(); return;
  }
  const th = e.target.closest('th.s');
  if (th){
    const c = th.dataset.sort;
    anSort = (anSort.col === c) ? { col:c, dir:-anSort.dir } : { col:c, dir: c === 'label' ? 1 : -1 };
    renderAnalysis(); return;
  }
});

document.addEventListener('input', e => {

    const pos = e.target.selectionStart;

  if (e.target.id === 'anQ'){ anQuery = e.target.value; renderAnalysis(); }

let dragDepth = 0;
const hasFiles = e => e.dataTransfer && [...(e.dataTransfer.types||[])].includes('Files');
const veil = show => {
  $('dropveil').classList.toggle('show', show);
  const card = $('dropcard'); if (card) card.classList.toggle('hot', show);
};
window.addEventListener('dragenter', e => { if (!hasFiles(e)) return; e.preventDefault(); dragDepth++; veil(true); });
window.addEventListener('dragover', e => { if (hasFiles(e)){ e.preventDefault(); e.dataTransfer.dropEffect = 'copy'; } });
window.addEventListener('dragleave', e => { if (!hasFiles(e)) return; dragDepth = Math.max(0, dragDepth-1); if (!dragDepth) veil(false); });
window.addEventListener('drop', e => {
  if (!hasFiles(e)) return;
  e.preventDefault(); dragDepth = 0; veil(false);
  const f = e.dataTransfer.files[0];
  if (!f) return;
  if (/^image\//.test(f.type) || /\.(svg|png|jpe?g|webp)$/i.test(f.name)){
    const r = new FileReader();
    r.onload = () => setLogo(r.result, false);
    r.readAsDataURL(f);
    return;
  }
  readFile(f);
});

function readFile(file){
  const msg = $('parseMsg');
  msg.className = 'msg'; msg.textContent = (LANG==='da'?'Læser ':'Reading ') + file.name + ' …';
  const fr = new FileReader();
  fr.onload = () => {
    try{
      const wb = XLSX.read(new Uint8Array(fr.result), { type:'array', cellDates:true });
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, { header:1, raw:true, defval:null, blankrows:false });
      MODEL = buildModel(rows);
      if (!MODEL.days.length) throw new Error(LANG==='da' ? 'Ingen bookingrækker fundet i filen.' : 'No booking rows found in that file.');
      dayIndex = 0; outletFilter = 'all'; query = ''; anQuery = ''; anFilters = {};
      openSlots.clear(); openOutlets.clear();
      anDim = 'outlet'; anSplit = ''; anScope = 'day'; tab = 'board';
      msg.textContent = '';
      $('dropzone').classList.add('hidden');
      $('board').classList.remove('hidden');
      $('tools').classList.remove('hidden');
      $('subline').textContent = T('ledeLoaded');
      $('fileMeta').textContent = file.name;
      buildAnalysisControls();
      render();
    }catch(err){
      msg.className = 'msg bad'; msg.textContent = err.message;
      if (!$('board').classList.contains('hidden')) toast(err.message);
    }
  };
  fr.onerror = () => { msg.className = 'msg bad'; msg.textContent = LANG==='da' ? 'Filen kunne ikke læses. Prøv at eksportere den igen.' : 'That file could not be read. Try exporting it again.'; };
  fr.readAsArrayBuffer(file);
}

applyStatic();
</script>
