<!DOCTYPE html>
<html lang="da">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Opinion Matters · Smyril Line</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0B1723; --card:#122130; --card2:#16283A; --line:rgba(226,166,75,.16);
  --line2:rgba(255,255,255,.07);
  --ink:#E8EEF4; --mut:#8FA3B3; --dim:#5F7486;
  --brass:#E2A64B; --brass-d:#B9832F; --teal:#2FA8B8; --sherpa:#004A59;
  --good:#46B08A; --ok:#7FBF6A; --warn:#E28B4B; --bad:#E05B4B;
  --r:14px; --shadow:0 10px 30px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  font-size:15px; line-height:1.5; min-height:100vh; overflow-x:hidden;
}
body::before{
  content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
  background:
    radial-gradient(900px 500px at 10% -10%, rgba(47,168,184,.13), transparent 60%),
    radial-gradient(800px 500px at 95% 0%, rgba(226,166,75,.10), transparent 60%),
    radial-gradient(700px 600px at 50% 110%, rgba(0,74,89,.25), transparent 60%);
}
.wrap{position:relative; z-index:1; max-width:1440px; margin:0 auto; padding:22px 22px 90px}
.mono{font-family:'IBM Plex Mono',ui-monospace,monospace}

/* ---------- header ---------- */
header.top{display:flex; align-items:center; gap:18px; flex-wrap:wrap; margin-bottom:20px}
.brandmark{display:flex; align-items:center; gap:14px}
.logo{height:44px; width:auto; display:block}
.logo-fb{width:44px;height:44px;border-radius:12px;background:linear-gradient(140deg,var(--sherpa),#0a2e38);
  display:grid;place-items:center;border:1px solid var(--line)}
h1{font-size:20px; font-weight:800; margin:0; letter-spacing:-.3px}
h1 small{display:block; font-size:11.5px; font-weight:600; color:var(--brass); letter-spacing:2.2px; text-transform:uppercase; margin-bottom:2px}
.top-actions{margin-left:auto; display:flex; gap:9px; flex-wrap:wrap}
button, .btn{
  font-family:inherit; font-size:13px; font-weight:600; color:var(--ink);
  background:var(--card); border:1px solid var(--line2); border-radius:10px;
  padding:9px 14px; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:7px;
}
button:hover,.btn:hover{border-color:var(--brass); color:#fff; background:var(--card2)}
button.primary{background:linear-gradient(135deg,var(--brass),var(--brass-d)); color:#1b1305; border-color:transparent}
button.primary:hover{filter:brightness(1.08); color:#1b1305}
button.ghost{background:transparent}
button.sm{padding:6px 10px; font-size:12px; border-radius:8px}

/* ---------- dropzone ---------- */
.drop{
  border:1.5px dashed rgba(226,166,75,.4); border-radius:20px; padding:54px 26px; text-align:center;
  background:linear-gradient(180deg,rgba(18,33,48,.75),rgba(18,33,48,.35)); backdrop-filter:blur(6px);
  transition:.2s; cursor:pointer;
}
.drop.hot{border-color:var(--brass); background:rgba(226,166,75,.09); transform:scale(1.005)}
.drop h2{margin:14px 0 6px; font-size:21px}
.drop p{margin:0 auto; max-width:620px; color:var(--mut); font-size:14px}
.drop .ico{font-size:40px}
.hint{color:var(--dim); font-size:12.5px; margin-top:16px}

/* ---------- dataset chips ---------- */
.dsbar{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px}
.chip{
  display:flex; align-items:center; gap:9px; background:var(--card); border:1px solid var(--line2);
  border-radius:12px; padding:8px 11px; font-size:13px; cursor:pointer; transition:.15s;
}
.chip:hover{border-color:var(--line)}
.chip.on{border-color:var(--brass); background:var(--card2); box-shadow:0 0 0 1px rgba(226,166,75,.25)}
.chip .dot{width:10px;height:10px;border-radius:50%;flex:none}
.chip .nm{font-weight:600}
.chip .n{color:var(--mut); font-size:11.5px}
.chip .x{color:var(--dim); font-weight:700; padding:0 2px}
.chip .x:hover{color:var(--bad)}

/* ---------- filters ---------- */
.filters{display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:18px;
  background:rgba(18,33,48,.55); border:1px solid var(--line2); border-radius:14px; padding:11px 13px}
.filters .lbl{font-size:11px; letter-spacing:1.4px; text-transform:uppercase; color:var(--dim); font-weight:700}
select, input[type=text], input[type=search]{
  font-family:inherit; font-size:13px; color:var(--ink); background:#0E1C29;
  border:1px solid var(--line2); border-radius:9px; padding:8px 10px; outline:none; max-width:260px;
}
select:focus, input:focus{border-color:var(--brass)}
label.inline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--mut)}
input[type=range]{accent-color:var(--brass); width:110px}

/* ---------- tabs ---------- */
nav.tabs{display:flex; gap:4px; flex-wrap:wrap; margin-bottom:20px; border-bottom:1px solid var(--line2); padding-bottom:0}
nav.tabs button{
  background:transparent; border:none; border-bottom:2px solid transparent; border-radius:8px 8px 0 0;
  padding:10px 14px; color:var(--mut); font-weight:600; font-size:13.5px;
}
nav.tabs button:hover{color:var(--ink); background:rgba(255,255,255,.03)}
nav.tabs button.on{color:var(--brass); border-bottom-color:var(--brass); background:rgba(226,166,75,.06)}

/* ---------- cards / grid ---------- */
.grid{display:grid; gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(210px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(420px,1fr))}
.card{
  background:linear-gradient(180deg,var(--card),rgba(18,33,48,.72)); border:1px solid var(--line2);
  border-radius:var(--r); padding:18px; box-shadow:var(--shadow); position:relative; overflow:hidden;
}
.card.accent::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--brass),transparent)}
.card h3{margin:0 0 4px; font-size:14px; font-weight:700; letter-spacing:.2px}
.card .sub{color:var(--mut); font-size:12px; margin:0 0 14px}
.sect-title{font-size:12px;letter-spacing:2px;text-transform:uppercase;color:var(--brass);font-weight:700;margin:26px 0 12px}
.kpi .val{font-size:32px; font-weight:800; letter-spacing:-1px; line-height:1.1; font-family:'IBM Plex Mono',monospace}
.kpi .cap{font-size:11px; letter-spacing:1.6px; text-transform:uppercase; color:var(--dim); font-weight:700; margin-bottom:6px}
.kpi .note{font-size:12px; color:var(--mut); margin-top:6px}
.delta{font-size:12.5px; font-weight:700; font-family:'IBM Plex Mono',monospace}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--mut)}

/* ---------- bars ---------- */
.qrow{display:grid; grid-template-columns:1fr 240px 86px; gap:14px; align-items:center; padding:9px 0; border-bottom:1px solid rgba(255,255,255,.05)}
.qrow:last-child{border-bottom:none}
.qname{font-size:13.5px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.qname .n{color:var(--dim); font-weight:500; font-size:11.5px; margin-left:6px}
.track{height:9px; border-radius:6px; background:rgba(255,255,255,.07); overflow:hidden; position:relative}
.fill{height:100%; border-radius:6px; transition:width .5s cubic-bezier(.2,.8,.2,1)}
.score{text-align:right; font-family:'IBM Plex Mono',monospace; font-weight:600; font-size:14px}
.dist{display:flex; height:9px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,.05)}
.dist i{display:block; height:100%}
.legend{display:flex; gap:12px; flex-wrap:wrap; font-size:11.5px; color:var(--mut); margin-top:12px}
.legend span{display:flex; align-items:center; gap:5px}
.legend b{width:10px;height:10px;border-radius:3px;display:block}

/* multi bars (comparison) */
.mbars{display:flex; flex-direction:column; gap:3px}
.mbar{display:flex; align-items:center; gap:8px}
.mbar .lb{font-size:10.5px; width:80px; color:var(--mut); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.mbar .track{flex:1}
.mbar .sc{font-family:'IBM Plex Mono',monospace; font-size:11.5px; width:38px; text-align:right}

/* ---------- tables ---------- */
.tblwrap{overflow:auto; border-radius:12px; border:1px solid var(--line2); max-height:74vh}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13px}
th,td{padding:9px 11px; text-align:left; white-space:nowrap}
thead th{
  position:sticky; top:0; z-index:3; background:#0F1E2C; color:var(--mut); font-size:11px;
  letter-spacing:1px; text-transform:uppercase; font-weight:700; border-bottom:1px solid var(--line2);
}
tbody tr:nth-child(even){background:rgba(255,255,255,.018)}
tbody tr:hover{background:rgba(226,166,75,.06)}
td.stick, th.stick{position:sticky; left:0; z-index:2; background:#101E2B; max-width:280px; overflow:hidden; text-overflow:ellipsis}
thead th.stick{z-index:4}
tbody tr:hover td.stick{background:#17293a}
.cell{display:block; text-align:center; border-radius:7px; padding:6px 4px; font-family:'IBM Plex Mono',monospace;
  font-weight:600; font-size:12.5px; color:#0B1723; min-width:52px}
.cell.na{background:rgba(255,255,255,.05); color:var(--dim); font-weight:500}
.num{font-family:'IBM Plex Mono',monospace; text-align:right}
.pill{display:inline-block; padding:2px 8px; border-radius:20px; font-size:11px; font-weight:700; font-family:'IBM Plex Mono',monospace}

/* ---------- comments ---------- */
.cmt{border:1px solid var(--line2); border-radius:12px; padding:14px; background:rgba(18,33,48,.6); margin-bottom:10px}
.cmt .meta{display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; font-size:11.5px; color:var(--mut)}
.cmt .txt{font-size:13.5px; line-height:1.6; white-space:pre-wrap}
.tag{background:rgba(255,255,255,.06); border:1px solid var(--line2); border-radius:20px; padding:2px 9px; font-size:11px}
.kw{display:inline-flex; gap:6px; align-items:center; background:rgba(226,166,75,.1); border:1px solid var(--line);
  color:var(--brass); border-radius:20px; padding:4px 11px; font-size:12px; cursor:pointer; margin:0 6px 6px 0}
.kw:hover{background:rgba(226,166,75,.2)}
.kw b{font-family:'IBM Plex Mono',monospace; color:var(--ink); font-weight:600}

.q{display:inline-grid; place-items:center; width:16px; height:16px; border-radius:50%;
  border:1px solid var(--line); color:var(--brass); background:rgba(226,166,75,.10);
  font-size:10.5px; font-weight:800; cursor:help; vertical-align:middle; margin-left:5px;
  line-height:1; flex:none; font-family:'Plus Jakarta Sans',sans-serif; user-select:none}
.q:hover{background:var(--brass); color:#0B1723; border-color:var(--brass)}
.pop{position:fixed; z-index:300; max-width:340px; background:#16283A; border:1px solid var(--brass);
  border-radius:12px; padding:13px 15px; box-shadow:0 16px 44px rgba(0,0,0,.55); font-size:13px;
  line-height:1.55; display:none}
.pop h4{margin:0 0 6px; font-size:13px; color:var(--brass); letter-spacing:.2px}
.pop .ex{margin-top:9px; color:var(--mut); font-size:12px; border-top:1px solid var(--line2); padding-top:8px}
.intro{color:var(--mut); font-size:13px; margin:-4px 0 16px; display:flex; align-items:center; gap:2px; flex-wrap:wrap}
.ovl{position:fixed; inset:0; background:rgba(6,12,19,.78); backdrop-filter:blur(4px); z-index:250;
  display:none; overflow:auto; padding:40px 20px}
.ovl.on{display:block}
.ovl .box{max-width:980px; margin:0 auto; background:var(--card); border:1px solid var(--line);
  border-radius:18px; padding:26px; box-shadow:var(--shadow)}
.gl{display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:12px; margin-top:16px}
.gl .it{background:rgba(255,255,255,.03); border:1px solid var(--line2); border-radius:12px; padding:13px 15px}
.gl .it b{color:var(--brass); font-size:13px; display:block; margin-bottom:5px}
.gl .it p{margin:0; font-size:12.8px; line-height:1.55; color:var(--ink)}
.gl .it .ex{margin-top:7px; font-size:11.8px; color:var(--mut)}
.langsw{display:flex;border:1px solid var(--line2);border-radius:10px;overflow:hidden}
.langsw button{border:none;border-radius:0;padding:9px 12px;font-size:12px;letter-spacing:.5px;color:var(--mut);background:transparent}
.langsw button.on{background:var(--brass);color:#1b1305}
.langsw button:hover{color:var(--ink)}
.langsw button.on:hover{color:#1b1305}
/* charts */
.gauge{width:100%;max-width:300px;height:auto;display:block;margin:6px auto 2px}
.gauge .g-val{font:800 40px 'IBM Plex Mono',monospace;letter-spacing:-1px}
.gauge .g-cap{font:700 10.5px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.8px;text-transform:uppercase;fill:var(--dim)}
.gauge .g-tick{font:600 11px 'IBM Plex Mono',monospace;fill:var(--dim)}
.donut{width:100%;max-width:160px;height:auto;display:block}
.donut .d-val{font:800 26px 'IBM Plex Mono',monospace}
.donut .d-cap{font:600 10px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.2px;text-transform:uppercase;fill:var(--dim)}
.ring{display:block;flex:none}
.ring .r-val{font:800 22px 'IBM Plex Mono',monospace}
.ring .r-cap{font:600 8.5px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.1px;text-transform:uppercase;fill:var(--dim)}
.spark{width:100%;height:auto;display:block;margin-top:6px}
.spark .s-tick{font:600 10.5px 'IBM Plex Mono',monospace;fill:var(--dim)}
.cwrap{display:flex;justify-content:center;padding:4px 0 12px}
.hero{display:grid;grid-template-columns:1.45fr 1fr 1fr 1fr;gap:14px;align-items:stretch}
@media(max-width:1200px){.hero{grid-template-columns:1fr 1fr}}
@media(max-width:640px){.hero{grid-template-columns:1fr}}
.hero-main{display:flex;flex-direction:column}
.hero-facts{display:flex;gap:16px;flex-wrap:wrap;margin-top:auto;padding-top:14px;border-top:1px solid var(--line2)}
.hero-facts div{display:flex;flex-direction:column}
.hero-facts b{font:800 20px 'IBM Plex Mono',monospace;line-height:1.2}
.hero-facts span{font-size:11px;color:var(--dim);letter-spacing:.4px}
.dleg{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.dleg div{display:flex;align-items:center;gap:7px;font-size:12px}
.dleg i{width:9px;height:9px;border-radius:3px;flex:none}
.dleg span{color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dleg b{font-family:'IBM Plex Mono',monospace;font-size:12px}
.dleg em{font-style:normal;color:var(--dim);font-size:11px;width:38px;text-align:right;font-family:'IBM Plex Mono',monospace}
.minirows{display:flex;flex-direction:column;gap:5px;margin-top:2px}
.mrow{display:flex;align-items:center;gap:8px;font-size:12px}
.mrow span{color:var(--mut);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow b{font-family:'IBM Plex Mono',monospace}
.rcard{display:flex;gap:14px;align-items:center;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.05)}
.rcard:last-child{border-bottom:none;padding-bottom:0}
.rmeta{display:flex;flex-direction:column;gap:3px;min-width:0}
.rmeta b{font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta span{font-size:11.5px;color:var(--mut)}
.rmeta .good{color:var(--good);font-weight:600}
.rmeta .bad{color:var(--bad);font-weight:600}
.mkgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mk{display:flex;gap:11px;align-items:center;background:rgba(255,255,255,.03);border:1px solid var(--line2);border-radius:12px;padding:10px}
.mkm{display:flex;flex-direction:column;gap:2px;min-width:0}
.mkm b{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mkm span{font-size:11px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.score2{text-align:right;line-height:1.15}
.score2 b{font:700 17px 'IBM Plex Mono',monospace;display:block}
.score2 i{font-style:normal;font-size:10.5px;color:var(--dim);font-family:'IBM Plex Mono',monospace}
.warnbar{background:rgba(226,139,75,.10);border:1px solid rgba(226,139,75,.35);color:#f0ab73;
  border-radius:12px;padding:11px 14px;font-size:12.8px;line-height:1.5;margin-bottom:16px}
/* hovedpointer */
.inslist{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:10px}
.ins{display:flex;gap:11px;align-items:flex-start;background:linear-gradient(180deg,var(--card),rgba(18,33,48,.7));
  border:1px solid var(--line2);border-left-width:3px;border-radius:12px;padding:12px 14px}
.ins i{font-style:normal;font-weight:800;font-size:12px;width:21px;height:21px;border-radius:50%;
  display:grid;place-items:center;flex:none;margin-top:1px}
.ins p{margin:0;font-size:13.2px;line-height:1.5}
.ins p b{color:#fff}
.ins.good{border-left-color:var(--good)} .ins.good i{background:rgba(70,176,138,.18);color:#6fd3b0}
.ins.bad{border-left-color:var(--bad)}   .ins.bad i{background:rgba(224,91,75,.18);color:#f19183}
.ins.act{border-left-color:var(--brass)} .ins.act i{background:rgba(226,166,75,.18);color:var(--brass)}
/* matrix */
.mxwrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
.matrix{width:100%;min-width:520px;height:auto;display:block}
.matrix .m-quad{font:800 10.5px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.6px;opacity:.9}
.matrix .m-num{font:700 12px 'IBM Plex Mono',monospace;fill:var(--ink)}
.matrix .m-ax{font:700 11px 'Plus Jakarta Sans',sans-serif;letter-spacing:1.3px;text-transform:uppercase;fill:var(--mut)}
.matrix .s-tick{font:600 10.5px 'IBM Plex Mono',monospace;fill:var(--dim)}
.qlegend{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:5px;margin-top:14px}
.qlegend span{display:flex;align-items:center;gap:8px;font-size:12.3px;color:var(--mut);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qlegend i{font-style:normal;width:20px;height:20px;border-radius:6px;display:grid;place-items:center;
  font:700 11px 'IBM Plex Mono',monospace;color:#0B1723;flex:none}
.ibar{width:96px;height:8px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden}
.ibar i{display:block;height:100%;border-radius:5px}
.daybars{width:100%;height:auto;display:block}
/* ordsky */
.cloud{display:flex;flex-wrap:wrap;gap:5px 14px;align-items:baseline;line-height:1.45;padding:4px 0}
.cw{cursor:pointer;font-weight:700;transition:.12s;border-radius:6px;padding:0 3px}
.cw:hover{background:rgba(226,166,75,.16);text-decoration:underline}
/* filterpanel */
.fbtn{display:none}
.fbody{display:contents}
.empty{color:var(--dim); text-align:center; padding:40px; font-size:14px}
.badge{font-size:10.5px; letter-spacing:1px; text-transform:uppercase; font-weight:700; padding:3px 8px; border-radius:6px}
.b-bad{background:rgba(224,91,75,.16); color:#f19183}
.b-good{background:rgba(70,176,138,.16); color:#6fd3b0}
.b-warn{background:rgba(226,139,75,.16); color:#f0ab73}
.toast{position:fixed; bottom:26px; left:50%; transform:translateX(-50%) translateY(20px); opacity:0;
  background:var(--card2); border:1px solid var(--brass); color:var(--ink); padding:12px 20px; border-radius:12px;
  font-size:13.5px; font-weight:600; z-index:99; transition:.25s; pointer-events:none; box-shadow:var(--shadow)}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
.scroll-x{overflow-x:auto; padding-bottom:6px}
details.fields{margin-top:10px}
details.fields summary{cursor:pointer; color:var(--mut); font-size:12.5px}
.fieldgrid{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:6px; margin-top:12px}
.fieldgrid label{display:flex; gap:8px; align-items:center; font-size:12.5px; color:var(--mut); background:rgba(255,255,255,.03);
  padding:6px 9px; border-radius:8px}
.fieldgrid input{accent-color:var(--brass)}

@media(max-width:860px){
  .wrap{padding:12px 11px 76px}
  h1{font-size:17px} h1 small{font-size:10px;letter-spacing:1.6px}
  .logo,.logo-fb{height:36px;width:36px}
  header.top{gap:10px;margin-bottom:14px}
  .top-actions{width:100%;margin-left:0;gap:6px}
  .top-actions button{flex:1 1 auto;justify-content:center;padding:10px 8px;font-size:12px}
  .langsw{order:-1}
  .qrow{grid-template-columns:1fr 78px !important;gap:6px;padding:10px 0}
  .qrow>div:nth-child(2){grid-column:1/-1;order:3;margin-top:2px}

<script>
/* ============================ SheetJS loader ============================ */
(function(){
  var urls=[
    "https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js",
    "https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"
  ];
  function load(i){
    if(i>=urls.length){ console.warn("SheetJS kunne ikke hentes"); return; }
    var s=document.createElement('script'); s.src=urls[i];
    s.onerror=function(){ load(i+1); };
    document.head.appendChild(s);
  }
  load(0);
})();
/* Smyril Line logo: lokal fil først, derefter officiel URL, ellers falkemærket */
(function(){
  var img=document.getElementById('logo'), fb=document.getElementById('logoFallback');
  var srcs=["logo.svg","https://smyrilline.com/wp-content/themes/lunnar-smyrilline/images/logo.svg"], i=0;
  img.onload=function(){ img.style.display='block'; fb.style.display='none'; };
  img.onerror=function(){ i++; if(i<srcs.length) img.src=srcs[i]; };
  img.src=srcs[0];
})();

/* ============================ CORE (analyse) ============================ */
/* --- Alt herunder er ren logik: parsing, klassificering, statistik --- */
var CORE = (function(){

  var IGNORE_RX = /(^submission date$|^departure date$|^source$|workflow|^agent$|e-?mail|^enter your email|fornavn|efternavn|first name|last name|^name$|chance to win|newsletter|^id$|^ip$|submission id|^passengers?$|country of residence|age \(number\)|^outbound or return$)/i;
  var NUM_BLACK = /(passenger|antal|number of|amount|qty|quantity|year|zip|postal|phone|price|dkk|eur)/i;

  function norm(s){ return String(s==null?'':s).trim().replace(/\s+/g,' '); }
  function key(s){ return norm(s).toLowerCase(); }
  function isBlank(v){ return v===null||v===undefined||norm(v)===''; }
  function num(v){
    if(typeof v==='number') return v;
    if(typeof v==='string' && /^-?\d+([.,]\d+)?$/.test(v.trim())) return parseFloat(v.trim().replace(',','.'));
    return null;
  }

  /* Find header-rækken: den første række med flest udfyldte tekstceller */
  function findHeaderRow(aoa){
    var best=0, bestScore=-1;
    for(var r=0; r<Math.min(8,aoa.length); r++){
      var row=aoa[r]||[], filled=0, strs=0;
      for(var c=0;c<row.length;c++){ if(!isBlank(row[c])){ filled++; if(typeof row[c]==='string') strs++; } }
      var score = strs*2 + filled;
      if(filled>=4 && score>bestScore && (aoa.length>r+1)){ bestScore=score; best=r; }
    }
    return best;
  }

  function toRecords(aoa){
    var h = findHeaderRow(aoa);
    var head = (aoa[h]||[]).map(norm);
    var seen={}, cols=[];
    head.forEach(function(x,i){
      var name = x || ('Kolonne '+(i+1));
      if(seen[name]!=null){ seen[name]++; name = name+' ('+seen[name]+')'; } else seen[name]=1;
      cols.push(name);
    });
    var recs=[];
    for(var r=h+1;r<aoa.length;r++){
      var row=aoa[r]||[], any=false, o={};
      for(var c=0;c<cols.length;c++){ var v=row[c]; if(!isBlank(v)){ any=true; o[cols[c]] = (typeof v==='string')? v.trim() : v; } }
      if(any) recs.push(o);
    }
    return {columns:cols, rows:recs};
  }

  /* Klassificér hver kolonne: rating / kategori / tekst / ignoreret */
  function classify(cols, rows){
    var meta=[];
    cols.forEach(function(c){
      var vals=[], nums=0, total=0, uniq={}, uniqN=0, maxLen=0, hasNL=false;
      for(var i=0;i<rows.length;i++){
        var v=rows[i][c]; if(isBlank(v)) continue;
        total++; vals.push(v);
        var n=num(v); if(n!==null) nums++;
        var s=String(v); if(s.length>maxLen) maxLen=s.length;
        if(s.indexOf('\n')>=0) hasNL=true;
        if(uniq[s]==null){ uniq[s]=0; uniqN++; } uniq[s]++;
      }
      var m={ col:c, k:key(c), label:c, short:shortLabel(c), n:total, uniq:uniqN, type:'ignore', multi:hasNL };
      if(total===0){ meta.push(m); return; }

      var numeric = nums/total >= .8;
      var minV=Infinity,maxV=-Infinity;
      if(numeric){ vals.forEach(function(v){ var n=num(v); if(n<minV)minV=n; if(n>maxV)maxV=n; }); }
      var looksQ = /\?|^\s*\d+(\.\d+)?[a-zA-Z]?[.\s)]/.test(c) || /\brate\b|\bhow\b|overall|satisfaction|score/i.test(c);
      var scaleHint = null;

      if(numeric && minV>=1 && maxV<=10 && uniqN<=10){
        m.scale = maxV<=5? 5 : (maxV<=7?7:10);
        m.autoScale = m.scale;
        m.candidate = true;
      }
      if(m.candidate && !NUM_BLACK.test(c) && !IGNORE_RX.test(c) && looksQ){
        m.type='rating';
      } else if(IGNORE_RX.test(c)){
        m.type='ignore';
      } else if(maxLen>90 && uniqN/total>.6){
        m.type='text';
      } else if(uniqN<=40 && uniqN/total<.7){
        m.type='cat';
      } else if(maxLen>40){
        m.type='text';
      } else {
        m.type='cat';
      }
      m.min=minV; m.max=maxV;
      meta.push(m);
    });
    return meta;
  }

  function shortLabel(s){
    var t = norm(s).replace(/^\s*\d+(?:\.\d+)*(?:\.?[a-zA-Z])?\s*[.):]?\s+/,'');
    t = t.replace(/^(please rate the|please tell us your|please rate|how was the|how was|how were the|how were|were the|how pleased were you with the|how pleased were you with|how likely are you to|what is your|what was the|which|did you|where did you|when did you|what made you|why did you)\s+/i,'');
    t = t.replace(/\s+on a scale of \d+ to \d+\s*$/i,'');
    t = t.replace(/\?+$/,'').trim();
    if(!t) t = norm(s);
    return t.charAt(0).toUpperCase()+t.slice(1);
  }

  /* Statistik for ét rating-spørgsmål på et sæt rækker */
  function stat(rows, col, scale){
    var sum=0,n=0,dist={},low=0,top=0;
    for(var i=0;i<rows.length;i++){
      var v=num(rows[i][col]); if(v===null) continue;
      n++; sum+=v; dist[v]=(dist[v]||0)+1;
      if(v<=2) low++;
      if(v>=scale) top++;
    }
    if(!n) return null;
    var avg=sum/n;
    return { n:n, avg:avg, dist:dist, index:(avg-1)/(scale-1)*100, low:low/n*100, top:top/n*100, scale:scale };
  }

  /* Samlet indeks pr. respondent (gennemsnit af alle normaliserede ratings) */
  function overallIndex(rows, ratings){
    var sum=0,n=0;
    for(var i=0;i<rows.length;i++){
      var s=0,c=0;
      for(var j=0;j<ratings.length;j++){
        var v=num(rows[i][ratings[j].col]); if(v===null) continue;
        s += (v-1)/(ratings[j].scale-1)*100; c++;
      }
      if(c){ sum+=s/c; n++; }
    }
    return n? {index:sum/n, n:n} : null;
  }

  function respondentIndex(row, ratings, minCount){
    var s=0,c=0;
    for(var j=0;j<ratings.length;j++){
      var v=num(row[ratings[j].col]); if(v===null) continue;
      s += (v-1)/(ratings[j].scale-1)*100; c++;
    }
    return c && c>=(minCount||1)? s/c : null;
  }

  /* Split multi-select-svar (Jotform bruger linjeskift) */
  function splitVals(v){
    if(isBlank(v)) return [];
    return String(v).split(/\r?\n/).map(function(x){return x.trim();}).filter(function(x){return x.length;});
  }

  function groupBy(rows, col, multi){
    var g={};
    for(var i=0;i<rows.length;i++){
      var v=rows[i][col]; if(isBlank(v)) continue;
      var parts = multi? splitVals(v) : [norm(v)];
      for(var p=0;p<parts.length;p++){
        (g[parts[p]] = g[parts[p]] || []).push(rows[i]);
      }
    }
    return g;
  }

  return { toRecords:toRecords, classify:classify, stat:stat, overallIndex:overallIndex,
           respondentIndex:respondentIndex, groupBy:groupBy, splitVals:splitVals, num:num,
           norm:norm, key:key, isBlank:isBlank, shortLabel:shortLabel, findHeaderRow:findHeaderRow };
})();
if(typeof module!=='undefined') module.exports = CORE;
</script>

function T(k,v){
  var e=STR[k]; if(!e) return k;
  var s=e[LANG]!=null? e[LANG] : e.da;
  if(v) for(var p in v) s=String(s).split('{'+p+'}').join(v[p]);
  return s;
}
function nf(x,d){
  if(x==null||isNaN(x)) return '–';
  var s=(Math.round(x*Math.pow(10,d))/Math.pow(10,d)).toFixed(d);
  return LANG==='da'? s.replace('.',',') : s;
}
function f1(x){ return nf(x,1); }
function f0(x){ return nf(x,0); }

function hlp(k){ return HELP[k]? '<span class="q" data-h="'+k+'">?</span>' : ''; }
(function(){
  var pop=null;
  function el(){ return pop || (pop=document.getElementById('pop')); }
  function show(target,k){
    var d=hd(k); if(!d) return;
    var p=el();
    p.innerHTML='<h4>'+esc(d.t)+'</h4><div>'+esc(d.d)+'</div>'+(d.ex?'<div class="ex">'+esc(d.ex)+'</div>':'');
    p.style.display='block';
    var r=target.getBoundingClientRect(), pw=p.offsetWidth, ph=p.offsetHeight;
    var left=Math.min(Math.max(8,r.left+r.width/2-pw/2), window.innerWidth-pw-8);
    var top=r.bottom+9;
    if(top+ph>window.innerHeight-8) top=Math.max(8,r.top-ph-9);
    p.style.left=left+'px'; p.style.top=top+'px';
  }
  function hide(){ if(pop) pop.style.display='none'; }
  document.addEventListener('mouseover',function(e){
    var t=e.target.closest? e.target.closest('.q'):null;
    if(t) show(t,t.dataset.h); else if(!(e.target.closest&&e.target.closest('#pop'))) hide();
  });
  document.addEventListener('click',function(e){
    var t=e.target.closest? e.target.closest('.q'):null;
    if(t){ e.stopPropagation(); show(t,t.dataset.h); } else hide();
  });
  document.addEventListener('keydown',function(e){ if(e.key==='Escape'){ hide(); var g=document.getElementById('glossary'); if(g) g.classList.remove('on'); } });
  window.addEventListener('scroll',hide,true);
})();

var RN=null;
function regionName(cc){
  try{ if(!RN||RN._l!==LANG){ RN=new Intl.DisplayNames([LANG],{type:'region'}); RN._l=LANG; }
       var n=RN.of(cc); if(n && n!==cc) return n; }catch(e){}
  return LANG==='da'? (CC[cc]||cc) : cc;
}
function flag(cc){
  if(!/^[A-Za-z]{2}$/.test(cc)) return '';
  var c=cc.toUpperCase();
  return String.fromCodePoint(0x1F1E6+c.charCodeAt(0)-65, 0x1F1E6+c.charCodeAt(1)-65);
}
function ccName(v){
  var s=CORE.norm(v);
  if(/^[A-Za-z]{2}$/.test(s)){ var u=s.toUpperCase(); return (flag(u)+' '+regionName(u)).trim(); }
  return s;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(msg){ var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},2400); }

function idxColor(v){
  if(v==null) return 'rgba(255,255,255,.06)';
  if(v>=88) return '#46B08A';
  if(v>=78) return '#7FBF6A';
  if(v>=68) return '#C9BB58';
  if(v>=58) return '#E2A64B';
  if(v>=45) return '#E28B4B';
  return '#E05B4B';
}
function critColor(v){ return idxColor(100-Math.min(100,v*3)); }
function distColors(scale){
  if(scale<=4) return {1:'#E05B4B',2:'#E28B4B',3:'#7FBF6A',4:'#46B08A'};
  if(scale===5) return {1:'#E05B4B',2:'#E28B4B',3:'#C9BB58',4:'#7FBF6A',5:'#46B08A'};
  var o={}; for(var i=1;i<=scale;i++){ o[i]=idxColor((i-1)/(scale-1)*100); } return o;
}

function handleFiles(files){
  if(typeof XLSX==='undefined'){
    toast(T('toastEngine'));
    var tries=0, iv=setInterval(function(){
      if(typeof XLSX!=='undefined'){ clearInterval(iv); handleFiles(files); }
      else if(++tries>40){ clearInterval(iv); toast(T('toastEngineErr')); }
    },250);
    return;
  }
  var list=[].slice.call(files||[]); if(!list.length) return;
  var done=0;
  list.forEach(function(f){
    var rd=new FileReader();
    rd.onload=function(ev){
      try{
        var wb=XLSX.read(new Uint8Array(ev.target.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        var aoa=XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null,blankrows:false});
        var rec=CORE.toRecords(aoa);
        if(!rec.rows.length){ toast(T('toastEmpty',{f:f.name})); return; }
        var ds={ id:'ds'+Date.now()+Math.random().toString(36).slice(2,6),
                 label:niceName(f.name), file:f.name, rows:rec.rows,
                 meta:CORE.classify(rec.columns,rec.rows),
                 color:COLORS[DS.length%COLORS.length] };
        DS.push(ds);
      }catch(err){ console.error(err); toast(T('toastRead',{f:f.name})); }
      done++;
      if(done===list.length){
        refreshDerived();
        document.getElementById('dropzone').style.display = DS.length? 'none':'block';
        document.getElementById('app').style.display = DS.length? 'block':'none';
        if(DS.length) toast(DS.length===1? T('toastLoaded1',{n:DS[0].rows.length}) : T('toastLoadedN',{n:DS.length}));
        render();
      }
    };
    rd.readAsArrayBuffer(f);
  });
}
function niceName(fn){
  var s=fn.replace(/\.(xlsx|xls|csv)$/i,'');
  s=s.replace(/your[_ ]?opinion[_ ]?matters([_ ]?to[_ ]?us)?/i,'').replace(/[_]+/g,' ').replace(/\s+/g,' ').trim();
  s=s.replace(/^\d{4}-\d{2}-\d{2}[ _]?\d{2}[ _:]\d{2}[ _:]\d{2}\s*/,'').trim();
  return s.slice(0,42) || fn.slice(0,30);
}

/* ---------------- afledte segmenter / derived segments ---------------- */
function refreshDerived(){
  DS.forEach(function(ds){
    ds.meta = ds.meta.filter(function(m){ return !m.derived; });
    var rs = ds.meta.filter(function(m){ return m.scale && (m.type==='rating'? !HIDDEN[m.k] : FORCE[m.k]); });

    function add(k, tk, valueFn, order){
      var used={}, n=0;
      ds.rows.forEach(function(r){
        var v=valueFn(r);
        if(v==null||v===''){ delete r[k]; return; }
        r[k]=v; used[v]=1; n++;
      });
      if(!n) return;
      var ord = order? order.filter(function(o){ return used[o]; })
                     : Object.keys(used).sort();
      ds.meta.push({col:k,k:k,label:T(tk),short:T(tk),tk:tk,type:'cat',multi:false,derived:true,n:n,uniq:ord.length,order:ord});
    }

    // rejseselskab / party size
    var pc=null; ds.meta.forEach(function(m){ if(/^passengers?$/i.test(m.col)) pc=m; });
    if(pc) add('__party','dimParty',function(r){
      var v=CORE.num(r[pc.col]); if(v===null||v<1) return null;
      return v===1? T('pSolo') : v===2? T('pCouple') : v<=4? T('pFamily') : T('pGroup');
    },[T('pSolo'),T('pCouple'),T('pFamily'),T('pGroup')]);

    // afgangsmåned / departure month
    var dc=null; ds.meta.forEach(function(m){ if(/departure date/i.test(m.col)) dc=m; });
    if(dc){
      var keys={};
      ds.rows.forEach(function(r){
        var s=CORE.norm(r[dc.col]); if(!s) return;
        var mm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
        var y,mo;
        if(mm){ mo=+mm[2]; y=+mm[3]; if(y<100) y+=2000; }
        else { var d=new Date(s); if(isNaN(d)) return; mo=d.getMonth()+1; y=d.getFullYear(); }
        if(!mo||!y) return;
        keys[y*100+mo]=1;
      });
      var ord=Object.keys(keys).map(Number).sort(function(a,b){return a-b;}).map(function(v){
        return T('months')[(v%100)-1]+' '+Math.floor(v/100);
      });
      add('__month','dimMonth',function(r){
        var s=CORE.norm(r[dc.col]); if(!s) return null;
        var mm=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/), y,mo;
        if(mm){ mo=+mm[2]; y=+mm[3]; if(y<100) y+=2000; }
        else { var d=new Date(s); if(isNaN(d)) return null; mo=d.getMonth()+1; y=d.getFullYear(); }
        if(!mo||!y) return null;
        return T('months')[mo-1]+' '+y;
      },ord);
    }

    // tilfredshedsgruppe / satisfaction group
    if(rs.length>=3) add('__sat','dimSat',function(r){
      var v=CORE.respondentIndex(r,rs,3); if(v==null) return null;
      return v>=80? T('satHigh') : v>=60? T('satMid') : v>=45? T('satLow') : T('satBad');
    },[T('satHigh'),T('satMid'),T('satLow'),T('satBad')]);

    // ambassadør / kritiker
    var rq=null; rs.forEach(function(m){ if(/recommend/i.test(m.col)) rq=m; });
    if(rq) add('__nps','dimNps',function(r){
      var v=CORE.num(r[rq.col]); if(v===null) return null;
      return v>=rq.scale? T('npsPro') : v<=2? T('npsCri') : T('npsPas');
    },[T('npsPro'),T('npsPas'),T('npsCri')]);
  });
}

/* ---------------- afledt data / derived data ---------------- */
function ratings(ds){ return ds.meta.filter(function(m){
  if(!m.scale) return false;
  if(m.type==='rating') return !HIDDEN[m.k];
  return !!FORCE[m.k];
}); }
function candidates(ds){ return ds.meta.filter(function(m){ return m.candidate && m.n>3; }); }
function dims(ds){ return ds.meta.filter(function(m){ return m.type==='cat' && m.n>=3 && m.uniq>1; }); }
function texts(ds){ return ds.meta.filter(function(m){ return m.type==='text'; }); }
function dimName(m){ return m.tk? T(m.tk) : m.short; }
function findCol(ds, rx){ for(var i=0;i<ds.meta.length;i++){ if(rx.test(ds.meta[i].col)) return ds.meta[i]; } return null; }
function countryCol(ds){ return findCol(ds,/^country$|nationalit|country of residence/i); }
function ageCol(ds){ return findCol(ds,/segment:\s*age/i) || findCol(ds,/tell us your age$/i); }
function commentCol(ds){
  var t=texts(ds); if(!t.length) return null;
  var best=null;
  t.forEach(function(m){ if(/improve|thoughts|comment|feedback|share/i.test(m.col)) best=m; });
  return best || t.sort(function(a,b){return b.n-a.n;})[0];
}
function valLabel(m){ return /country|nationalit/i.test(m.col)? ccName : function(x){return x;}; }
function ordered(m, names, counts){
  if(m.order && m.order.length){
    var o=m.order.filter(function(x){ return names.indexOf(x)>=0; });
    names.forEach(function(x){ if(o.indexOf(x)<0) o.push(x); });
    return o;
  }
  return names.slice().sort(function(a,b){ return counts[b]-counts[a]; });
}
function rowsOf(ds){
  var keys=Object.keys(FILTERS).filter(function(k){ return FILTERS[k]; });
  var q=SEARCH.trim().toLowerCase();
  if(!keys.length && !q) return ds.rows;
  return ds.rows.filter(function(r){
    for(var i=0;i<keys.length;i++){
      var m=matchMeta(ds,keys[i]); if(!m) continue;
      var v=r[m.col]; if(CORE.isBlank(v)) return false;
      var parts=m.multi? CORE.splitVals(v):[CORE.norm(v)];
      if(parts.indexOf(FILTERS[keys[i]])<0) return false;
    }
    if(q){
      var hit=false;
      for(var c in r){ if(String(r[c]).toLowerCase().indexOf(q)>=0){ hit=true; break; } }
      if(!hit) return false;
    }
    return true;
  });
}
function matchMeta(ds, k){ for(var i=0;i<ds.meta.length;i++){ if(ds.meta[i].k===k) return ds.meta[i]; } return null; }

function renderChrome(){

  document.getElementById('subtitle').textContent=T('subtitle');
  document.getElementById('btnHelp').textContent=T('help');
  var c=document.getElementById('btnCopy'); c.textContent=T('copy'); c.title=T('copyT');
  var p=document.getElementById('btnPrint'); p.textContent=T('print'); p.title=T('printT');
  var v=document.getElementById('btnCsv'); v.textContent=T('csv'); v.title=T('csvT');
  document.getElementById('btnImport').textContent=T('import');

/* ---------------- byggeklodser / building blocks ---------------- */
function bar(pct,color){
  return '<div class="track"><div class="fill" style="width:'+Math.max(0,Math.min(100,pct))+'%;background:linear-gradient(90deg,'+color+'99,'+color+')"></div></div>';
}
function distBar(st){
  var c=distColors(st.scale), h='<div class="dist">';
  for(var i=1;i<=st.scale;i++){
    var v=(st.dist[i]||0)/st.n*100;
    if(v>0) h+='<i style="width:'+v+'%;background:'+c[i]+'" title="'+i+': '+(st.dist[i]||0)+' ('+f0(v)+'%)"></i>';
  }
  return h+'</div>';
}
function distLegend(scale){
  var c=distColors(scale), h='<div class="legend">';
  for(var i=1;i<=scale;i++) h+='<span><b style="background:'+c[i]+'"></b>'+i+'</span>';
  return h+'<span style="color:var(--dim)">'+T('scaleWorst',{n:scale})+'</span></div>';
}
var QSORT='index';
function sortItems(items, mode){
  var f={ index:function(x){return -x.st.index;}, avg:function(x){return -x.st.avg;},
          n:function(x){return -x.st.n;}, crit:function(x){return -x.st.low;},
          top:function(x){return -x.st.top;}, name:null };
  if(mode==='name') return items.sort(function(a,b){ return a.m.short.localeCompare(b.m.short); });
  var g=f[mode]||f.index;
  return items.sort(function(a,b){ return g(a)-g(b); });
}
function sortSelect(id){
  var o=[['index',T('sIndex')],['avg',T('sAvg')],['n',T('sN')],['crit',T('sCrit')],['top',T('sTop')],['name',T('sName')]];
  return '<label class="inline" style="margin-left:auto">'+T('sortBy')+hlp('sortering')+' <select id="'+id+'" style="padding:5px 8px;font-size:12px">'
    + o.map(function(x){ return '<option value="'+x[0]+'"'+(QSORT===x[0]?' selected':'')+'>'+x[1]+'</option>'; }).join('')+'</select></label>';
}
function qList(rows, rs, opts){
  opts=opts||{};
  var items=[];
  rs.forEach(function(m){ var st=CORE.stat(rows,m.col,m.scale); if(st) items.push({m:m,st:st}); });
  if(opts.fixed) items.sort(function(a,b){ return (opts.asc?1:-1)*(b.st.index-a.st.index); });
  else sortItems(items,QSORT);
  if(opts.limit) items=items.slice(0,opts.limit);
  if(!items.length) return '<div class="empty">'+T('noRating')+'</div>';
  var h='';
  items.forEach(function(it){
    h+='<div class="qrow"><div class="qname" title="'+esc(it.m.label)+'">'+esc(it.m.short)
      +'<span class="n">n='+it.st.n+' · 1–'+it.st.scale+'</span></div>'
      +'<div>'+(opts.dist? distBar(it.st) : bar(it.st.index, idxColor(it.st.index)))+'</div>'
      + scoreCell(it.st)+'</div>';
  });
  return h;
}
function kpi(cap,val,note,color,hk){
  return '<div class="card kpi accent"><div class="cap">'+cap+(hk?hlp(hk):'')+'</div><div class="val" style="color:'+(color||'var(--ink)')+'">'+val+'</div>'
    +(note?'<div class="note">'+note+'</div>':'')+'</div>';
}

/* ---------------- SVG-grafik / SVG charts ---------------- */
function gaugeSVG(idx, opts){
  opts=opts||{};
  var w=280,h=172,cx=140,cy=142,r=104,sw=20;
  var C=Math.PI*r;
  var v=(idx==null)?0:Math.max(0,Math.min(100,idx));
  var len=v/100*C;
  var d='M '+(cx-r)+' '+cy+' A '+r+' '+r+' 0 0 1 '+(cx+r)+' '+cy;
  var col=idxColor(idx);
  var h2='<svg viewBox="0 0 '+w+' '+h+'" class="gauge" role="img">';
  h2+='<defs><linearGradient id="gg" x1="0" y1="0" x2="1" y2="0">'
    +'<stop offset="0%" stop-color="'+col+'88"/><stop offset="100%" stop-color="'+col+'"/></linearGradient></defs>';
  h2+='<path d="'+d+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'" stroke-linecap="round"/>';
  h2+='<path d="'+d+'" fill="none" stroke="url(#gg)" stroke-width="'+sw+'" stroke-linecap="round" stroke-dasharray="'+len+' '+(C-len+2)+'"/>';
  function tick(val,col,wid,lbl){
    var a=Math.PI*(1-Math.max(0,Math.min(100,val))/100);
    var x1=cx+Math.cos(a)*(r-sw/2-3), y1=cy-Math.sin(a)*(r-sw/2-3);
    var x2=cx+Math.cos(a)*(r+sw/2+4), y2=cy-Math.sin(a)*(r+sw/2+4);
    return '<line x1="'+x1+'" y1="'+y1+'" x2="'+x2+'" y2="'+y2+'" stroke="'+col+'" stroke-width="'+wid+'" stroke-linecap="round"><title>'+esc(lbl||'')+'</title></line>';
  }
  if(opts.mark!=null) h2+=tick(opts.mark,'rgba(232,238,244,.7)',2.5,opts.markLabel);
  if(opts.target!=null) h2+=tick(opts.target,'#E2A64B',3.5,T('target')+': '+opts.target);
  h2+='<text x="'+cx+'" y="'+(cy-30)+'" text-anchor="middle" class="g-val" fill="'+col+'">'+(idx==null?'–':f1(idx))+'</text>';
  h2+='<text x="'+cx+'" y="'+(cy-6)+'" text-anchor="middle" class="g-cap">'+esc(opts.cap||'')+'</text>';
  h2+='<text x="'+(cx-r)+'" y="'+(cy+22)+'" text-anchor="middle" class="g-tick">0</text>';
  h2+='<text x="'+(cx+r)+'" y="'+(cy+22)+'" text-anchor="middle" class="g-tick">100</text>';
  return h2+'</svg>';
}
function donutSVG(segs, opts){
  opts=opts||{};
  var size=opts.size||152, sw=opts.sw||20, r=(size-sw)/2-3, cx=size/2, cy=size/2;
  var C=2*Math.PI*r, tot=0;
  segs.forEach(function(s){ tot+=s.v; });
  var h='<svg viewBox="0 0 '+size+' '+size+'" class="donut" role="img">';
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.06)" stroke-width="'+sw+'"/>';
  if(tot){
    var off=0;
    segs.forEach(function(s){
      if(!s.v) return;
      var len=s.v/tot*C;
      h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+s.color+'" stroke-width="'+sw+'"'
        +' stroke-dasharray="'+len+' '+(C-len)+'" stroke-dashoffset="'+(-off)+'"'
        +' transform="rotate(-90 '+cx+' '+cy+')"><title>'+esc(s.label)+': '+s.v+' ('+f0(s.v/tot*100)+'%)</title></circle>';
      off+=len;
    });
  }
  if(opts.center!=null) h+='<text x="'+cx+'" y="'+(cy+(opts.sub?0:7))+'" text-anchor="middle" class="d-val" fill="'+(opts.centerColor||'var(--ink)')+'">'+opts.center+'</text>';
  if(opts.sub) h+='<text x="'+cx+'" y="'+(cy+20)+'" text-anchor="middle" class="d-cap">'+esc(opts.sub)+'</text>';
  return h+'</svg>';
}
function ringSVG(pct, col, center, sub, size){
  size=size||104;
  var sw=11, r=(size-sw)/2-2, cx=size/2, cy=size/2, C=2*Math.PI*r;
  var len=Math.max(0,Math.min(100,pct||0))/100*C;
  var h='<svg viewBox="0 0 '+size+' '+size+'" class="ring" role="img">';
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="'+sw+'"/>';
  h+='<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="none" stroke="'+col+'" stroke-width="'+sw+'" stroke-linecap="round"'
    +' stroke-dasharray="'+len+' '+(C-len)+'" transform="rotate(-90 '+cx+' '+cy+')"/>';
  h+='<text x="'+cx+'" y="'+(cy+(sub?1:6))+'" text-anchor="middle" class="r-val" fill="'+col+'">'+center+'</text>';
  if(sub) h+='<text x="'+cx+'" y="'+(cy+17)+'" text-anchor="middle" class="r-cap">'+esc(sub)+'</text>';
  return h+'</svg>';
}
function sparkSVG(pts, opts){
  opts=opts||{};
  var w=opts.w||640, h=opts.h||150, pl=34, pr=12, pt=16, pb=26;
  if(pts.length<2) return '';
  var vs=pts.map(function(p){return p.v;});
  var lo=Math.min.apply(null,vs), hi=Math.max.apply(null,vs);
  lo=Math.max(0,Math.floor((lo-6)/5)*5); hi=Math.min(100,Math.ceil((hi+6)/5)*5);
  if(hi-lo<10) hi=lo+10;
  var iw=w-pl-pr, ih=h-pt-pb;
  function X(i){ return pl + (pts.length===1?iw/2:i/(pts.length-1)*iw); }
  function Y(v){ return pt + (1-(v-lo)/(hi-lo))*ih; }
  var s='<svg viewBox="0 0 '+w+' '+h+'" class="spark" preserveAspectRatio="none" role="img">';
  [0,.5,1].forEach(function(f){
    var y=pt+f*ih, val=hi-(hi-lo)*f;
    s+='<line x1="'+pl+'" y1="'+y+'" x2="'+(w-pr)+'" y2="'+y+'" stroke="rgba(255,255,255,.07)" stroke-width="1"/>';
    s+='<text x="'+(pl-7)+'" y="'+(y+4)+'" text-anchor="end" class="s-tick">'+f0(val)+'</text>';
  });
  var line=pts.map(function(p,i){ return (i?'L':'M')+X(i)+' '+Y(p.v); }).join(' ');
  s+='<path d="'+line+' L '+X(pts.length-1)+' '+(pt+ih)+' L '+X(0)+' '+(pt+ih)+' Z" fill="rgba(226,166,75,.12)"/>';
  s+='<path d="'+line+'" fill="none" stroke="var(--brass)" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>';
  pts.forEach(function(p,i){
    s+='<circle cx="'+X(i)+'" cy="'+Y(p.v)+'" r="4.5" fill="'+idxColor(p.v)+'" stroke="#0B1723" stroke-width="2"><title>'+esc(p.k)+': '+f1(p.v)+' (n='+p.n+')</title></circle>';
    s+='<text x="'+X(i)+'" y="'+(h-8)+'" text-anchor="middle" class="s-tick">'+esc(p.k)+'</text>';
  });
  return s+'</svg>';
}
function scoreCell(st){
  return '<div class="score2"><b style="color:'+idxColor(st.index)+'">'+f0(st.index)+'</b>'
    +'<i>'+f1(st.avg)+' / '+st.scale+'</i></div>';
}

/* ---------------- 1. Overblik / Overview ---------------- */
function viewOverview(){
  var ds=DS[ACTIVE], rows=rowsOf(ds), rs=ratings(ds);
  if(!rs.length) return '<div class="empty">'+T('noRating')+'</div>';
  if(!rows.length) return '<div class="empty">'+T('noRowsFilter')+'</div>';

  var oi=CORE.overallIndex(rows,rs);
  var items=rs.map(function(m){ return {m:m, st:CORE.stat(rows,m.col,m.scale)}; }).filter(function(x){return x.st;});
  items.sort(function(a,b){ return b.st.index-a.st.index; });
  var rec=null; rs.forEach(function(m){ if(/recommend/i.test(m.col)) rec=m; });
  var recSt = rec? CORE.stat(rows,rec.col,rec.scale) : null;

  /* gæstestemning / sentiment */
  var sat={hi:0,mid:0,lo:0,bad:0}, scored=0;
  rows.forEach(function(r){
    var v=CORE.respondentIndex(r,rs,3); if(v==null) return;
    scored++;
    if(v>=80) sat.hi++; else if(v>=60) sat.mid++; else if(v>=45) sat.lo++; else sat.bad++;
  });
  var unhappy=sat.lo+sat.bad;

  /* kritiske svar samlet / overall critical share */
  var critN=0, critTot=0;
  rs.forEach(function(m){ var st=CORE.stat(rows,m.col,m.scale); if(st){ critN+=st.low/100*st.n; critTot+=st.n; } });
  var critPct = critTot? critN/critTot*100 : 0;

  /* sammenligningsmærke fra andet datasæt / baseline mark */
  var mark=null, markLbl='';
  if(DS.length>1){
    var other=DS[ACTIVE===0?1:0], oo=CORE.overallIndex(rowsOf(other),ratings(other));
    if(oo){ mark=oo.index; markLbl=other.label+': '+f1(oo.index); }
  }

  var h=intro(T('introOver'),'samlet');

  /* --- hero --- */
  h+='<div class="hero">';
  h+='<div class="card accent hero-main"><h3>'+T('heroTitle')+hlp('samlet')+'</h3>'
    +'<p class="sub">'+T('heroSub')+'</p>'
    + gaugeSVG(oi? oi.index:null,{cap:T('kIndexN2'),mark:mark,markLabel:markLbl,target:TARGET})
    +'<div class="hero-facts">'
      +'<div><b>'+rows.length+'</b><span>'+T('kResp')+(rows.length!==ds.rows.length? ' ('+T('kRespOf',{n:ds.rows.length})+')':'')+'</span></div>'
      +'<div><b>'+items.length+'</b><span>'+T('heroQ')+'</span></div>'
      +(mark!=null? '<div><b class="delta '+(oi.index-mark>0.5?'up':(oi.index-mark<-0.5?'down':'flat'))+'">'+(oi.index-mark>0?'+':'')+f1(oi.index-mark)+'</b><span>'+T('vsBase',{d:'',x:esc(DS[ACTIVE===0?1:0].label)}).trim()+'</span></div>' : '')
      +(oi? '<div><b class="delta '+(oi.index>=TARGET?'up':'down')+'">'+(oi.index-TARGET>0?'+':'')+f1(oi.index-TARGET)+'</b><span>'+(oi.index>=TARGET? T('targetHit',{v:'',t:TARGET}) : T('targetMiss',{v:'',t:TARGET})).replace(/^\s+/,'')+'</span></div>' : '')
    +'</div></div>';

  h+='<div class="card"><h3>'+T('sentiment')+hlp('utilfredse')+'</h3><p class="sub">'+T('sentimentS')+'</p>'
    + '<div class="cwrap">'

               {center:scored? f0((sat.hi+sat.mid)/scored*100)+'%':'–', sub:T('satisfiedShort'), centerColor:'#7FBF6A'})

  if(recSt){
    var pro=0,pas=0,cri=0;
    rows.forEach(function(r){

  /* --- udvikling pr. måned --- */

    +(rs.some(function(m){return m.scale!==maxSc;})? '<p class="sub" style="margin-top:6px">'+T('distNote')+'</p>':'')+'</div>';
  h+='</div>';

  /* --- største markeder --- */
  var cc=countryCol(ds);
  if(cc){
    var gc=CORE.groupBy(rows,cc.col,cc.multi), counts={};
    Object.keys(gc).forEach(function(k){ counts[k]=gc[k].length; });
    var top=Object.keys(gc).filter(function(k){ return gc[k].length>=MINN; })
              .sort(function(a,b){return gc[b].length-gc[a].length;}).slice(0,8)
              .map(function(k){ var o=CORE.overallIndex(gc[k],rs); return {k:k,o:o,n:gc[k].length}; })
              .filter(function(x){return x.o;});
    if(top.length){
      h+='<div class="sect-title">'+T('topMarkets')+hlp('rangering')+'</div><div class="card"><p class="sub">'+T('topMarketsS',{n:MINN,h:hlp('minn')})+'</p><div class="mkgrid">';
      top.sort(function(a,b){ return b.o.index-a.o.index; }).forEach(function(x){
        h+='<div class="mk">'+ringSVG(x.o.index, idxColor(x.o.index), f0(x.o.index),'',86)
          +'<div class="mkm"><b>'+esc(ccName(x.k))+'</b><span>n='+x.n+' · '+f0(x.n/rows.length*100)+'%</span>'
          +'<span class="delta '+(x.o.index-oi.index>1?'up':(x.o.index-oi.index<-1?'down':'flat'))+'">'+(x.o.index-oi.index>0?'+':'')+f1(x.o.index-oi.index)+'</span></div></div>';
      });
      h+='</div></div>';
    }

  return h;
}

function viewDim(meta, title){
  var ds=DS[ACTIVE];
  if(!meta) return '<div class="empty">'+T('dimMissing',{x:title.toLowerCase()})+'</div>';
  return dimReport(ds, meta, title);

function dimReport(ds, meta, title){
  var rows=rowsOf(ds), rs=ratings(ds);
  var g=CORE.groupBy(rows,meta.col,meta.multi), counts={};
  Object.keys(g).forEach(function(k){ counts[k]=g[k].length; });
  var names=ordered(meta,Object.keys(g).filter(function(k){ return g[k].length>=MINN; }),counts);
  var small=Object.keys(g).filter(function(k){ return g[k].length<MINN; });
  if(!names.length) return '<div class="empty">'+T('noGroups',{n:MINN})+'</div>';
  var lbl=valLabel(meta);

  var overall=CORE.overallIndex(rows,rs);
  var h=intro(T('introDim',{x:title.toLowerCase(),n:MINN}),'minn')
    +'<div class="sect-title">'+T('dimIndex',{x:title})+hlp('samlet')+'</div><div class="grid g2">';
  h+='<div class="card"><h3>'+T('ranking')+hlp('rangering')+'</h3><p class="sub">'+T('rankingS',{h:hlp('delta'),v:(overall?f1(overall.index):'–')})+'</p>';
  var ranked=names.map(function(nm){ var o=CORE.overallIndex(g[nm],rs); return {nm:nm,o:o,n:g[nm].length}; })
                  .filter(function(x){return x.o;}).sort(function(a,b){return b.o.index-a.o.index;});
  ranked.forEach(function(x){
    var d = overall? x.o.index-overall.index : 0;
    h+='<div class="qrow" style="grid-template-columns:1fr 210px 58px 58px"><div class="qname">'+esc(lbl(x.nm))+'<span class="n">n='+x.n+'</span></div>'
      +'<div>'+bar(x.o.index, idxColor(x.o.index))+'</div>'
      +'<div class="score">'+f1(x.o.index)+'</div>'
      +'<div class="score delta '+(d>1?'up':(d<-1?'down':'flat'))+'">'+(d>0?'+':'')+f1(d)+'</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h3>'+T('bestWorst')+hlp('stbedst')+'</h3><p class="sub">'+T('bestWorstS')+'</p>'
    +'<div class="tblwrap" style="max-height:none"><table><thead><tr><th class="stick">'+esc(title)+'</th><th>'+T('colResp')+hlp('n')+'</th><th>'+T('colBest')+'</th><th>'+T('colWorst')+'</th></tr></thead><tbody>';
  ranked.forEach(function(x){
    var items=rs.map(function(m){ return {m:m,st:CORE.stat(g[x.nm],m.col,m.scale)}; })
                .filter(function(z){ return z.st && z.st.n>=Math.max(3,Math.floor(MINN/2)); })
                .sort(function(a,b){ return b.st.index-a.st.index; });
    if(!items.length) return;
    var b=items[0], w=items[items.length-1];
    h+='<tr><td class="stick">'+esc(lbl(x.nm))+'</td><td class="num">'+x.n+'</td>'
      +'<td><span class="pill" style="background:rgba(70,176,138,.15);color:#6fd3b0">'+f1(b.st.avg)+'</span> '+esc(b.m.short)+'</td>'
      +'<td><span class="pill" style="background:rgba(224,91,75,.15);color:#f19183">'+f1(w.st.avg)+'</span> '+esc(w.m.short)+'</td></tr>';
  });
  h+='</tbody></table></div></div></div>';

  h+='<div class="sect-title">'+T('heat',{x:title.toLowerCase()})+hlp('heatmap')+'</div>';
  h+='<div class="card"><p class="sub">'+T('heatS',{n:MINN})
    +(small.length? T('heatOmit',{x:esc(small.map(lbl).join(', '))}) : '')+'</p>';
  h+=heatmap(rows, rs, g, names, lbl);
  h+='</div>';
  return h;
}
function heatmap(rows, rs, g, names, lbl){
  var items=rs.map(function(m){ return {m:m, st:CORE.stat(rows,m.col,m.scale)}; }).filter(function(x){return x.st;})
              .sort(function(a,b){ return a.st.index-b.st.index; });
  var h='<div class="tblwrap"><table><thead><tr><th class="stick">'+T('question')+hlp('heatmap')+'</th><th>'+T('total')+hlp('gns')+'</th>';
  names.forEach(function(nm){ h+='<th style="text-align:center">'+esc(lbl(nm))+'<br><span style="color:var(--dim);font-weight:500">n='+g[nm].length+'</span></th>'; });
  h+='</tr></thead><tbody>';
  items.forEach(function(it){
    h+='<tr><td class="stick" title="'+esc(it.m.label)+'">'+esc(it.m.short)+'</td>';
    h+='<td><span class="cell" style="background:'+idxColor(it.st.index)+'">'+f1(it.st.avg)+'</span></td>';
    names.forEach(function(nm){
      var st=CORE.stat(g[nm],it.m.col,it.m.scale);
      if(!st || st.n<Math.max(3,Math.floor(MINN/2))) h+='<td><span class="cell na">–</span></td>';
      else {
        var d=st.avg-it.st.avg;
        h+='<td><span class="cell" style="background:'+idxColor(st.index)+'" title="n='+st.n+' · '+(d>0?'+':'')+f1(d)+'">'+f1(st.avg)+'</span></td>';
      }
    });
    h+='</tr>';
  });
  return h+'</tbody></table></div>';
}

/* ---------------- 4. Analyse / Analysis ---------------- */
var SEG_DIM=null, SEG_SPLIT='', SEG_Q='__overall__';
function measureOf(rws, qm, rs, mode){
  // returnerer {v: talværdi, disp: tekst, idx: 0-100 til farve, n: antal}
  if(mode==='count'){ return {v:rws.length, disp:String(rws.length), idx:null, n:rws.length}; }
  if(qm){
    var st=CORE.stat(rws,qm.col,qm.scale); if(!st) return null;
    if(mode==='crit') return {v:st.low, disp:f0(st.low)+'%', idx:100-st.low*2.5, n:st.n};
    if(mode==='top')  return {v:st.top, disp:f0(st.top)+'%', idx:st.top, n:st.n};
    return {v:st.avg, disp:f1(st.avg), idx:st.index, n:st.n};
  }
  if(mode==='crit'||mode==='top'){
    var s=0,c=0;
    rs.forEach(function(m){ var st=CORE.stat(rws,m.col,m.scale); if(st){ s+=(mode==='crit'?st.low:st.top); c++; } });
    if(!c) return null;
    var v=s/c;
    return {v:v, disp:f0(v)+'%', idx:(mode==='crit'? 100-v*2.5 : v), n:rws.length};
  }
  var o=CORE.overallIndex(rws,rs); if(!o) return null;
  return {v:o.index, disp:f1(o.index), idx:o.index, n:o.n};
}
function viewSegment(){
  var ds=DS[ACTIVE], cs=dims(ds), rs=ratings(ds);
  if(!cs.length) return '<div class="empty">'+T('noCat')+'</div>';
  if(!SEG_DIM || !matchMeta(ds,SEG_DIM)) SEG_DIM=(countryCol(ds)||cs[0]).k;
  var dim=matchMeta(ds,SEG_DIM);
  var split = SEG_SPLIT? matchMeta(ds,SEG_SPLIT) : null;
  if(split && split.k===dim.k) split=null;

  function dimOpts(sel,allowNone){
    return (allowNone? '<option value="">'+T('noSplit')+'</option>':'')
      + cs.map(function(m){ return '<option value="'+esc(m.k)+'"'+(m.k===sel?' selected':'')+'>'+esc(dimName(m))+(m.derived?' ('+T('derived')+')':'')+'</option>'; }).join('');
  }
  var mode='avg';
  if(SEG_Q==='__count__') mode='count';
  else if(SEG_Q==='__crit__') mode='crit';
  else if(SEG_Q==='__top__') mode='top';
  var qm = (SEG_Q.indexOf('__')===0)? null : matchMeta(ds,SEG_Q);
  var mName = qm? qm.short : (mode==='count'? T('mCount') : mode==='crit'? T('mCrit') : mode==='top'? T('mTop') : T('mIndex'));

  var lb='font-size:11px;letter-spacing:1.4px;text-transform:uppercase;color:var(--dim);font-weight:700';
  var h=intro(T('introSeg'),'kryds')
    +'<div class="card" style="margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">'
    +'<span style="'+lb+'">'+T('groupBy')+'</span>'+hlp('afledt')
    +'<select id="segDim">'+dimOpts(SEG_DIM,false)+'</select>'
    +'<span style="'+lb+'">'+T('splitBy')+'</span>'+hlp('kryds')
    +'<select id="segSplit">'+dimOpts(split?split.k:'',true)+'</select>'
    +'<span style="'+lb+'">'+T('measure')+'</span>'+hlp('maal')
    +'<select id="segQ">'
      +'<option value="__overall__"'+(SEG_Q==='__overall__'?' selected':'')+'>'+T('mIndex')+'</option>'
      +'<option value="__count__"'+(SEG_Q==='__count__'?' selected':'')+'>'+T('mCount')+'</option>'
      +'<option value="__crit__"'+(SEG_Q==='__crit__'?' selected':'')+'>'+T('mCrit')+'</option>'
      +'<option value="__top__"'+(SEG_Q==='__top__'?' selected':'')+'>'+T('mTop')+'</option>'
      + rs.map(function(m){ return '<option value="'+esc(m.k)+'"'+(m.k===SEG_Q?' selected':'')+'>'+esc(m.short)+'</option>'; }).join('')
    +'</select></div>';

  var rows=rowsOf(ds), g=CORE.groupBy(rows,dim.col,dim.multi), counts={};
  Object.keys(g).forEach(function(k){ counts[k]=g[k].length; });
  var names=ordered(dim,Object.keys(g),counts);
  var lbl=valLabel(dim);
  var base=measureOf(rows,qm,rs,mode);

  h+='<div class="grid g2">';
  h+='<div class="card"><h3>'+esc(T('perX',{m:mName,x:dimName(dim).toLowerCase()}))+(qm?hlp('gns'):hlp(mode==='count'?'andel':'samlet'))+'</h3>'
    +'<p class="sub">'+T('fadedNote',{n:MINN,h:hlp('minn')})+(mode==='count'?'':' · '+T('colGap')+hlp('delta'))+'</p>';
  var rank=[];
  names.forEach(function(nm){
    var mv=measureOf(g[nm],qm,rs,mode); if(!mv) return;
    rank.push({nm:nm, mv:mv, n:g[nm].length});
  });
  var maxV=Math.max.apply(null,rank.map(function(x){return x.mv.v;}))||1;
  rank.sort(function(a,b){ return (mode==='crit'? a.mv.v-b.mv.v : b.mv.v-a.mv.v); });
  rank.forEach(function(x){
    var faded=x.n<MINN;
    var pct = mode==='count'? x.mv.v/maxV*100 : (x.mv.idx!=null? x.mv.idx : x.mv.v/maxV*100);
    var col = mode==='count'? '#2FA8B8' : idxColor(x.mv.idx);
    var d = (base && mode!=='count')? x.mv.v-base.v : null;
    h+='<div class="qrow" style="grid-template-columns:1fr 190px 58px 56px;'+(faded?'opacity:.42':'')+'">'
      +'<div class="qname">'+esc(lbl(x.nm))+'<span class="n">n='+x.mv.n+'</span></div>'
      +'<div>'+bar(pct,col)+'</div><div class="score">'+x.mv.disp+'</div>'
      +'<div class="score delta '+(d>0.1?'up':(d<-0.1?'down':'flat'))+'">'+(d!=null? (d>0?'+':'')+f1(d) : '')+'</div></div>';
  });
  h+='</div>';

  h+='<div class="card"><h3>'+T('share')+hlp('andel')+'</h3><p class="sub">'+T('shareS')+(dim.multi? T('multiNote'):'')+'</p>';
  var tot=rows.length;
  names.forEach(function(nm){
    var p=g[nm].length/tot*100;
    h+='<div class="qrow" style="grid-template-columns:1fr 190px 74px"><div class="qname">'+esc(lbl(nm))+'</div><div>'
      +bar(p,'#2FA8B8')+'</div><div class="score">'+g[nm].length+' <span style="color:var(--dim);font-size:11.5px">'+f0(p)+'%</span></div></div>';
  });
  h+='</div></div>';

  if(split){
    var g2=CORE.groupBy(rows,split.col,split.multi), c2={};
    Object.keys(g2).forEach(function(k){ c2[k]=g2[k].length; });
    var cols=ordered(split,Object.keys(g2).filter(function(k){ return g2[k].length>=MINN; }),c2);
    var lbl2=valLabel(split);
    h+='<div class="sect-title">'+T('crossH',{a:esc(dimName(dim)),b:esc(dimName(split))})+hlp('kryds')+'</div><div class="card">'
      +'<p class="sub">'+T('crossS',{a:esc(dimName(dim)),b:esc(dimName(split)),m:esc(mName),n:MINN})+'</p>'
      +'<div class="tblwrap"><table><thead><tr><th class="stick">'+esc(dimName(dim))+'</th><th>'+T('total')+'</th>';
    cols.forEach(function(c){ h+='<th style="text-align:center">'+esc(lbl2(c))+'<br><span style="color:var(--dim);font-weight:500">n='+g2[c].length+'</span></th>'; });
    h+='</tr></thead><tbody>';
    names.filter(function(nm){ return g[nm].length>=MINN; }).forEach(function(nm){
      var tt=measureOf(g[nm],qm,rs,mode);
      h+='<tr><td class="stick">'+esc(lbl(nm))+'</td>'
        +'<td>'+(tt? '<span class="cell" style="background:'+(mode==='count'?'#2FA8B8':idxColor(tt.idx))+'" title="n='+tt.n+'">'+tt.disp+'</span>':'<span class="cell na">–</span>')+'</td>';
      cols.forEach(function(c){
        var sub=g[nm].filter(function(r){
          var v=r[split.col]; if(CORE.isBlank(v)) return false;
          var parts=split.multi? CORE.splitVals(v):[CORE.norm(v)];
          return parts.indexOf(c)>=0;
        });
        var mv = sub.length>=Math.max(3,Math.floor(MINN/2))? measureOf(sub,qm,rs,mode) : null;
        h+='<td>'+(mv? '<span class="cell" style="background:'+(mode==='count'?'#2FA8B8':idxColor(mv.idx))+'" title="n='+mv.n+'">'+mv.disp+'</span>' : '<span class="cell na">–</span>')+'</td>';
      });
      h+='</tr>';
    });
    h+='</tbody></table></div></div>';
  }

  var names2=names.filter(function(n){ return g[n].length>=MINN; });
  if(names2.length){
    h+='<div class="sect-title">'+T('heatAllQ',{x:esc(dimName(dim).toLowerCase())})+hlp('heatmap')+'</div><div class="card">'
      +heatmap(rows,rs,g,names2,lbl)+'</div>';
  }
  return h;
}

/* ---------------- korrelation / driveranalyse ---------------- */
function corrOf(rows, colA, colB){
  var n=0,sa=0,sb=0,saa=0,sbb=0,sab=0;
  for(var i=0;i<rows.length;i++){
    var a=CORE.num(rows[i][colA]), b=CORE.num(rows[i][colB]);
    if(a===null||b===null) continue;
    n++; sa+=a; sb+=b; saa+=a*a; sbb+=b*b; sab+=a*b;
  }
  if(n<12) return null;
  var va=saa/n-(sa/n)*(sa/n), vb=sbb/n-(sb/n)*(sb/n);
  if(va<=0||vb<=0) return null;
  return {r:(sab/n-(sa/n)*(sb/n))/Math.sqrt(va*vb), n:n};
}
function targetQ(ds){
  var rs=ratings(ds), t=null;
  rs.forEach(function(m){ if(/recommend/i.test(m.col)) t=m; });
  if(!t) rs.forEach(function(m){ if(/overall/i.test(m.col)) t=m; });
  return t;
}
function driverData(ds, rows){
  var rs=ratings(ds), tq=targetQ(ds);
  if(!tq) return null;
  var out=[];
  rs.forEach(function(m){
    if(m.k===tq.k) return;
    var need=Math.max(15, Math.round(rows.length*0.12));
    var st=CORE.stat(rows,m.col,m.scale); if(!st || st.n<need) return;
    var c=corrOf(rows,m.col,tq.col); if(!c) return;
    out.push({m:m, st:st, r:Math.max(0,c.r), n:c.n});
  });
  if(out.length<3) return null;
  return {target:tq, items:out};
}
function median(a){
  if(!a.length) return 0;
  var b=a.slice().sort(function(x,y){return x-y;}), i=Math.floor(b.length/2);
  return b.length%2? b[i] : (b[i-1]+b[i])/2;
}

/* ---------------- afgange / departures ---------------- */
function departureCol(ds){ return findCol(ds,/departure date/i); }
function departureSection(ds, rows){
  var dc=departureCol(ds); if(!dc) return '';
  var rs=ratings(ds);
  var g=CORE.groupBy(rows,dc.col,false);
  var keys=Object.keys(g).filter(function(k){ return g[k].length>=Math.max(4,MINN); });
  if(keys.length<2) return '';
  var list=keys.map(function(k){
    var o=CORE.overallIndex(g[k],rs);
    return o? {k:k, v:o.index, n:g[k].length, d:parseDate(k)} : null;
  }).filter(Boolean).sort(function(a,b){ return b.v-a.v; });
  if(list.length<2) return '';
  var h='<div class="sect-title">'+T('departures')+'</div><div class="card"><p class="sub">'+T('departuresS',{n:Math.max(4,MINN)})+'</p>'
    +'<div class="tblwrap" style="max-height:420px"><table><thead><tr><th class="stick">'+T('departure')+'</th><th>'+T('sIndex')+'</th><th></th><th>'+T('colResp')+'</th></tr></thead><tbody>';
  list.forEach(function(x){
    h+='<tr><td class="stick">'+esc(fmtDate(x.d)||x.k)+'</td>'
      +'<td><span class="cell" style="background:'+idxColor(x.v)+'">'+f0(x.v)+'</span></td>'
      +'<td style="width:52%">'+bar(x.v,idxColor(x.v))+'</td>'
      +'<td class="num">'+x.n+'</td></tr>';
  });
  return h+'</tbody></table></div></div>';
}
function parseDate(s){
  s=CORE.norm(s); if(!s) return null;
  var m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if(m){ var y=+m[3]; if(y<100) y+=2000; return new Date(y,+m[2]-1,+m[1]); }
  var d=new Date(s); return isNaN(d)? null : d;
}
function fmtDate(d){
  if(!d) return null;
  return d.getDate()+'. '+T('months')[d.getMonth()]+' '+d.getFullYear();
}

/* ---------------- svar pr. dag / responses per day ---------------- */
function dayBarsSVG(rows, ds){
  var sc=findCol(ds,/submission date/i) || departureCol(ds);
  if(!sc) return '';
  var c={};
  rows.forEach(function(r){
    var d=parseDate(r[sc.col]); if(!d) return;
    var k=d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2);
    c[k]=(c[k]||0)+1;
  });
  var keys=Object.keys(c).sort();
  if(keys.length<3) return '';
  if(keys.length>60) keys=keys.slice(-60);
  var max=Math.max.apply(null,keys.map(function(k){return c[k];}));
  var W=740,H=120,pb=24,gap=keys.length>28?1:3;
  var bw=(W-keys.length*gap)/keys.length;
  var s='<svg viewBox="0 0 '+W+' '+H+'" class="daybars" preserveAspectRatio="none" role="img">';
  keys.forEach(function(k,i){
    var bh=Math.max(2,c[k]/max*(H-pb));
    var x=i*(bw+gap);
    s+='<rect x="'+x+'" y="'+(H-pb-bh)+'" width="'+bw+'" height="'+bh+'" rx="2" fill="var(--teal)" fill-opacity=".75">'
      +'<title>'+k+': '+c[k]+'</title></rect>';
  });
  s+='</svg>';
  var d0=parseDate(keys[0].split('-').reverse().join('/')) || new Date(keys[0]);
  var d1=parseDate(keys[keys.length-1].split('-').reverse().join('/')) || new Date(keys[keys.length-1]);
  return '<div class="card"><h3>'+T('perDay')+'</h3><p class="sub">'+T('perDayS',{a:esc(fmtDate(d0)||''),b:esc(fmtDate(d1)||''),m:max})+'</p>'+s+'</div>';
}

/* ---------------- hovedpointer / key takeaways ---------------- */
function insights(ds, rows){
  var rs=ratings(ds), out=[];
  if(!rs.length||!rows.length) return out;
  var oi=CORE.overallIndex(rows,rs);
  var items=rs.map(function(m){ return {m:m,st:CORE.stat(rows,m.col,m.scale)}; }).filter(function(x){return x.st;})
              .sort(function(a,b){ return a.st.index-b.st.index; });
  if(!items.length) return out;

  out.push({t:'good', x:T('insBest',{q:items[items.length-1].m.short, v:f0(items[items.length-1].st.index),
            p:f0(items[items.length-1].st.top)})});
  out.push({t:'bad', x:T('insWorst',{q:items[0].m.short, v:f0(items[0].st.index), p:f0(items[0].st.low)})});

  /* driver */
  var d=driverData(ds,rows);
  if(d){
    var my=median(d.items.map(function(x){return x.r;})), mx=median(d.items.map(function(x){return x.st.index;}));
    var fix=d.items.filter(function(x){ return x.r>=my && x.st.index<mx; }).sort(function(a,b){ return b.r-a.r; })[0];
    if(fix) out.push({t:'act', x:T('insDriver',{q:fix.m.short, v:f0(fix.st.index)})});
    else {
      var keep=d.items.slice().sort(function(a,b){ return b.r-a.r; })[0];
      if(keep) out.push({t:'good', x:T('insDriverOk',{q:keep.m.short, v:f0(keep.st.index)})});
    }
  }

  /* segmentudsving */
  var worstSeg=null;
  dims(ds).forEach(function(dim){
    if(dim.k==='__sat'||dim.k==='__nps') return;
    var g=CORE.groupBy(rows,dim.col,dim.multi);
    Object.keys(g).forEach(function(nm){
      if(g[nm].length<Math.max(12,MINN*2)) return;
      if(CORE.norm(nm).length>34) return;
      var o=CORE.overallIndex(g[nm],rs); if(!o||!oi) return;
      var gap=o.index-oi.index;
      if(gap<-5 && (!worstSeg||gap<worstSeg.gap)) worstSeg={dim:dim,nm:nm,gap:gap,v:o.index,n:g[nm].length};
    });
  });
  if(worstSeg) out.push({t:'bad', x:T('insSegment',{g:valLabel(worstSeg.dim)(worstSeg.nm), d:esc(dimName(worstSeg.dim).toLowerCase()),
                          v:f0(worstSeg.v), gap:f1(Math.abs(worstSeg.gap)), n:worstSeg.n})});

  /* bedste marked */
  var cc=countryCol(ds);
  if(cc){
    var gc=CORE.groupBy(rows,cc.col,cc.multi), best=null;
    Object.keys(gc).forEach(function(k){
      if(gc[k].length<Math.max(12,MINN*2)) return;
      var o=CORE.overallIndex(gc[k],rs); if(!o) return;
      if(!best||o.index>best.v) best={k:k,v:o.index,n:gc[k].length};
    });
    if(best) out.push({t:'good', x:T('insMarket',{g:ccName(best.k), v:f0(best.v), n:best.n})});
  }

  /* utilfredse */
  var un=rows.filter(function(r){ var v=CORE.respondentIndex(r,rs,3); return v!=null && v<50; }).length;
  if(un) out.push({t:'act', x:T('insUnhappy',{n:un, p:f0(un/rows.length*100)})});

  /* udvikling vs andet datasæt */
  if(DS.length>1 && ACTIVE!==0){
    var base=DS[0], ob=CORE.overallIndex(rowsOf(base),ratings(base));
    if(ob&&oi){
      var dd=oi.index-ob.index;
      out.push({t:Math.abs(dd)<1?'act':(dd>0?'good':'bad'), x:T('insTrend',{d:(dd>0?'+':'')+f1(dd), x:base.label})});
      var drop=null;
      rs.forEach(function(m){
        var mm=matchMeta(base,m.k); if(!mm) return;
        var a=CORE.stat(rowsOf(base),mm.col,mm.scale), b=CORE.stat(rows,m.col,m.scale);
        if(!a||!b) return;
        var g2=b.index-a.index;
        if(g2<-3 && (!drop||g2<drop.g)) drop={q:m.short,g:g2};
      });
      if(drop) out.push({t:'bad', x:T('insDrop',{q:drop.q, v:f1(Math.abs(drop.g)), x:base.label})});
    }
  }

  /* hyppigste tema blandt utilfredse */
  var cm=commentCol(ds);
  if(cm){
    var low=rows.filter(function(r){ var v=CORE.respondentIndex(r,rs,2); return v!=null && v<60 && CORE.norm(r[cm.col]); })
                .map(function(r){ return CORE.norm(r[cm.col]); });
    if(low.length>=5){
      var kw=keywords(low)[0];
      if(kw && kw.n>=3) out.push({t:'act', x:T('insTheme',{w:kw.w, n:kw.n, t:low.length})});
    }
  }
  return out;
}
function insightCards(ds, rows){
  var ins=insights(ds,rows);
  if(!ins.length) return '';
  var ic={good:'✓',bad:'!',act:'→'};
  return '<div class="sect-title">'+T('takeaways')+hlp('hovedpointer')+'</div>'
    +'<div class="inslist">'+ins.map(function(x){
      return '<div class="ins '+x.t+'"><i>'+ic[x.t]+'</i><p>'+x.x+'</p></div>';
    }).join('')+'</div>';
}

      h+='<div class="cmt"><div class="meta">'
        +'<span class="pill" style="background:'+idxColor(x.i)+';color:#0B1723">'+T('idx',{n:f0(x.i)})+'</span>'
        +(cc&&x.r[cc.col]? '<span class="tag">'+esc(ccName(x.r[cc.col]))+'</span>':'')
        +(ac&&x.r[ac.col]? '<span class="tag">'+esc(x.r[ac.col])+'</span>':'')
        + lowScoreTags(x.r, rs)
        +'</div>'+(txt? '<div class="txt">'+esc(txt)+'</div>' : '<div class="txt" style="color:var(--dim)">'+T('noComment')+'</div>')+'</div>';
    });
    if(crit.length>25) h+='<div class="empty">'+T('andMore',{n:crit.length-25})+'</div>';
  }
  return h+'</div>';
}
function lowScoreTags(r, rs){
  var out=[];
  rs.forEach(function(m){
    var v=CORE.num(r[m.col]);
    if(v!==null && v<=2) out.push('<span class="tag" style="border-color:rgba(224,91,75,.4);color:#f19183">'+esc(m.short)+': '+v+'</span>');
  });
  if(out.length>5){ var n=out.length-5; out=out.slice(0,5); out.push('<span class="tag">'+T('more',{n:n})+'</span>'); }
  return out.join('');
}

/* ---------------- 6. Gæsteprofil / Guest profile ---------------- */
function viewProfile(){
  var ds=DS[ACTIVE], rows=rowsOf(ds), cs=dims(ds);
  if(!cs.length) return '<div class="empty">'+T('noCat')+'</div>';
  var h=intro(T('introProfile'),'profil')+'<div class="grid g3">';
  cs.forEach(function(m){
    var g=CORE.groupBy(rows,m.col,m.multi), counts={};
    Object.keys(g).forEach(function(k){ counts[k]=g[k].length; });
    var names=ordered(m,Object.keys(g),counts).slice(0,14);
    if(!names.length) return;
    var lbl=valLabel(m), tot=rows.length;
    h+='<div class="card"><h3 title="'+esc(m.label)+'">'+esc(dimName(m))+(m.derived?' <span class="badge b-warn">'+T('derived')+'</span>':'')+(m.multi?hlp('multi'):hlp('andel'))+'</h3>'
      +'<p class="sub">'+m.n+' '+T('answers')+(m.multi? T('multiNote'):'')+'</p>';
    names.forEach(function(nm){
      var p=g[nm].length/tot*100;
      h+='<div class="qrow" style="grid-template-columns:1fr 110px 66px;padding:6px 0">'
        +'<div class="qname" style="font-size:12.5px" title="'+esc(nm)+'">'+esc(lbl(nm))+'</div>'
        +'<div>'+bar(p,'#2FA8B8')+'</div>'
        +'<div class="score" style="font-size:12.5px">'+g[nm].length+' <span style="color:var(--dim)">'+f0(p)+'%</span></div></div>';
    });
    h+='</div>';
  });
  return h+'</div>';
}

/* ---------------- 7. Kommentarer / Comments ---------------- */
var CQ='', CFILT='all';
function viewComments(){
  var ds=DS[ACTIVE], rows=rowsOf(ds), rs=ratings(ds);
  var tcols=texts(ds);
  if(!tcols.length) return '<div class="empty">'+T('noText')+'</div>';
  var cm=commentCol(ds), cc=countryCol(ds), ac=ageCol(ds);

  var all=[];
  rows.forEach(function(r){
    var txt=cm? CORE.norm(r[cm.col]) : '';
    if(!txt) return;
    all.push({ r:r, txt:txt, i:CORE.respondentIndex(r,rs,2) });
  });
  var list=all.filter(function(x){
    if(CFILT==='low' && !(x.i!=null && x.i<60)) return false;
    if(CFILT==='high' && !(x.i!=null && x.i>=80)) return false;
    if(CQ && x.txt.toLowerCase().indexOf(CQ.toLowerCase())<0) return false;
    return true;
  });
  list.sort(function(a,b){ return (a.i==null?999:a.i)-(b.i==null?999:b.i); });

  var h=intro(T('introComments'),'utilfredse')
    +'<div class="card" style="margin-bottom:16px;display:flex;gap:12px;flex-wrap:wrap;align-items:center">'
    +'<input type="search" id="cq" placeholder="'+T('searchC')+'" value="'+esc(CQ)+'" style="max-width:340px;flex:1">'
    +'<select id="cfilt">'
    +'<option value="all"'+(CFILT==='all'?' selected':'')+'>'+T('cAll',{n:all.length})+'</option>'
    +'<option value="low"'+(CFILT==='low'?' selected':'')+'>'+T('cLow')+'</option>'
    +'<option value="high"'+(CFILT==='high'?' selected':'')+'>'+T('cHigh')+'</option>'
    +'</select>'
    +'<span class="mono" style="color:var(--mut);font-size:12.5px;margin-left:auto">'+T('shown',{n:list.length})+'</span></div>';

  var kws=keywords(all.map(function(x){return x.txt;}));
  if(kws.length){
    var mx=kws[0].n, cloud=kws.slice(0,44);
    h+='<div class="card" style="margin-bottom:16px"><h3>'+T('cloud')+hlp('temaer')+'</h3><p class="sub">'+T('cloudS')+'</p><div class="cloud">'
      + cloud.map(function(k){
          var hits=all.filter(function(x){ return x.txt.toLowerCase().indexOf(k.w)>=0; });
          var sc=hits.filter(function(x){ return x.i!=null; });
          var avg=sc.length? sc.reduce(function(a,b){return a+b.i;},0)/sc.length : null;
          var size=13+Math.round(Math.pow(k.n/mx,.65)*21);
          return '<span class="cw" data-kw="'+esc(k.w)+'" style="font-size:'+size+'px;color:'+(avg==null?'var(--mut)':idxColor(avg))+'"'
            +' title="'+k.n+' ×'+(avg!=null? ' · '+T('idx',{n:f0(avg)}):'')+'">'+esc(k.w)+'</span>';
        }).join('')
      + '</div></div>';
    h+='<div class="card" style="margin-bottom:16px"><h3>'+T('themes')+hlp('temaer')+'</h3><p class="sub">'+T('themesS')+'</p>'
      + kws.slice(0,26).map(function(k){ return '<span class="kw" data-kw="'+esc(k.w)+'">'+esc(k.w)+' <b>'+k.n+'</b></span>'; }).join('')
      + '</div>';
  }
  if(!list.length) h+='<div class="empty">'+T('noMatch')+'</div>';
  list.slice(0,300).forEach(function(x){
    h+='<div class="cmt"><div class="meta">'
      +(x.i!=null? '<span class="pill" style="background:'+idxColor(x.i)+';color:#0B1723">'+T('idx',{n:f0(x.i)})+'</span>':'')
      +(cc&&x.r[cc.col]? '<span class="tag">'+esc(ccName(x.r[cc.col]))+'</span>':'')
      +(ac&&x.r[ac.col]? '<span class="tag">'+esc(x.r[ac.col])+'</span>':'')
      + lowScoreTags(x.r, rs)
      +'</div><div class="txt">'+esc(x.txt)+'</div></div>';
  });

  var others=tcols.filter(function(t){ return !cm || t.k!==cm.k; });
  if(others.length){
    h+='<div class="sect-title">'+T('otherText')+'</div><div class="grid g2">';
    others.forEach(function(t){
      var vals=rows.map(function(r){return CORE.norm(r[t.col]);}).filter(function(v){return v;});
      if(!vals.length) return;
      var cnt={}; vals.forEach(function(v){ cnt[v]=(cnt[v]||0)+1; });
      var ks=Object.keys(cnt).sort(function(a,b){return cnt[b]-cnt[a];}).slice(0,15);
      h+='<div class="card"><h3>'+esc(t.short)+'</h3><p class="sub">'+vals.length+' '+T('answers')+'</p>'
        + ks.map(function(k){ return '<div class="qrow" style="grid-template-columns:1fr 60px;padding:6px 0"><div class="qname" style="font-size:12.5px;white-space:normal">'+esc(k)+'</div><div class="score">'+cnt[k]+'</div></div>'; }).join('')
        + '</div>';
    });
    h+='</div>';
  }
  return h;
}
