var STOPSET={}; STOP.forEach(function(w){ STOPSET[w]=1; });
function keywords(txts){
  var c={};
  txts.forEach(function(t){
    var ws=t.toLowerCase().replace(/[^\p{L}\p{N}\s'-]/gu,' ').split(/\s+/), seen={};
    ws.forEach(function(w){
      if(w.length<4 || STOPSET[w] || /^\d+$/.test(w)) return;
      if(seen[w]) return; seen[w]=1;
      c[w]=(c[w]||0)+1;
    });
  });
  return Object.keys(c).filter(function(w){return c[w]>=3;}).map(function(w){return {w:w,n:c[w]};})
    .sort(function(a,b){ return b.n-a.n; });
}

/* ---------------- 8. Sammenlign / Compare ---------------- */
function viewCompare(){
  if(DS.length<2) return '<div class="empty">'+T('needTwo')+'</div>';
  var base=DS[0], common=[];
  ratings(base).forEach(function(m){
    var ok=true, entry={m:m, per:[]};
    DS.forEach(function(d){
      var mm=matchMeta(d,m.k);
      if(!mm || !mm.scale){ ok=false; return; }
      var st=CORE.stat(rowsOf(d),mm.col,mm.scale);
      entry.per.push(st);
      if(!st) ok=false;
    });
    if(ok) common.push(entry);
  });
  if(!common.length) return '<div class="empty">'+T('noCommon')+'</div>';

  var h=intro(T('introCompare'),'sammenlign')+'<div class="grid g4">';
  var ob=CORE.overallIndex(rowsOf(DS[0]),ratings(DS[0]));
  DS.forEach(function(d,i){
    var r=rowsOf(d), o=CORE.overallIndex(r,ratings(d));
    var dd = (o&&ob&&i>0)? o.index-ob.index : null;
    h+='<div class="card kpi" style="border-color:'+d.color+'55"><div class="cap" style="color:'+d.color+'">'+esc(d.label)+'</div>'
      +'<div class="val">'+(o?f1(o.index):'–')+'</div>'
      +'<div class="note">'+r.length+' '+T('answers')+' · '+(dd!=null? '<span class="delta '+(dd>0.5?'up':(dd<-0.5?'down':'flat'))+'">'+T('vsBase',{d:(dd>0?'+':'')+f1(dd),x:esc(DS[0].label)})+'</span>' : T('baseline'))+'</div></div>';
  });
  h+='</div>';

  h+='<div class="sect-title">'+T('qByQ')+hlp('sammenlign')+'</div><div class="card">'
    +'<p class="sub">'+T('qByQs',{h:hlp('delta')})+'</p>';
  common.sort(function(a,b){
    return (a.per[a.per.length-1].avg-a.per[0].avg)-(b.per[b.per.length-1].avg-b.per[0].avg);
  });
  common.forEach(function(e){
    var d=e.per[e.per.length-1].avg-e.per[0].avg;
    h+='<div style="padding:12px 0;border-bottom:1px solid rgba(255,255,255,.05)">'
      +'<div style="display:flex;align-items:center;gap:10px;margin-bottom:7px">'
      +'<b style="font-size:13.5px">'+esc(e.m.short)+'</b>'
      +'<span class="delta '+(d>0.1?'up':(d<-0.1?'down':'flat'))+'" style="margin-left:auto">'+(d>0?'▲ +':(d<0?'▼ ':'– '))+f1(d)+'</span></div>'
      +'<div class="mbars">'
      + DS.map(function(ds2,i){
          var st=e.per[i]; if(!st) return '';
          return '<div class="mbar"><div class="lb">'+esc(ds2.label)+'</div>'
            +'<div class="track"><div class="fill" style="width:'+st.index+'%;background:linear-gradient(90deg,'+ds2.color+'88,'+ds2.color+')"></div></div>'
            +'<div class="sc">'+f1(st.avg)+'</div><div class="lb" style="width:46px;text-align:right">n='+st.n+'</div></div>';
        }).join('')
      +'</div></div>';
  });
  h+='</div>';

  var cc=countryCol(base), ac=ageCol(base), pc=matchMeta(base,'__party');
  [[cc,T('tNat')],[ac,T('tAge')],[pc,T('dimParty')]].forEach(function(pair){
    var meta=pair[0]; if(!meta) return;
    var lbl=valLabel(meta), groups={};
    DS.forEach(function(d){
      var mm=matchMeta(d,meta.k); if(!mm) return;
      var g=CORE.groupBy(rowsOf(d),mm.col,mm.multi);
      Object.keys(g).forEach(function(nm){ groups[nm]=(groups[nm]||0)+g[nm].length; });
    });
    var names=ordered(meta,Object.keys(groups),groups);
    if(!names.length) return;
    h+='<div class="sect-title">'+T('idxAcross',{x:pair[1].toLowerCase()})+hlp('samlet')+'</div><div class="card"><div class="tblwrap" style="max-height:none"><table><thead><tr><th class="stick">'+esc(pair[1])+'</th>'
      + DS.map(function(d){ return '<th style="text-align:center;color:'+d.color+'">'+esc(d.label)+'</th>'; }).join('')
      + '<th style="text-align:center">Δ'+hlp('delta')+'</th></tr></thead><tbody>';
    names.forEach(function(nm){
      var vals=DS.map(function(d){
        var mm=matchMeta(d,meta.k); if(!mm) return null;
        var g=CORE.groupBy(rowsOf(d),mm.col,mm.multi);
        if(!g[nm] || g[nm].length<MINN) return null;
        var o=CORE.overallIndex(g[nm],ratings(d));
        return o? {v:o.index,n:g[nm].length} : null;
      });
      if(!vals.some(function(v){return v;})) return;
      var first=null,last=null;
      vals.forEach(function(v){ if(v){ if(first===null) first=v.v; last=v.v; } });
      var d=(first!==null&&last!==null)? last-first : null;
      h+='<tr><td class="stick">'+esc(lbl(nm))+'</td>'
        + vals.map(function(v){ return v? '<td><span class="cell" style="background:'+idxColor(v.v)+'" title="n='+v.n+'">'+f0(v.v)+'</span></td>' : '<td><span class="cell na">–</span></td>'; }).join('')
        + '<td class="num '+(d>1?'up':(d<-1?'down':'flat'))+'">'+(d!=null? (d>0?'+':'')+f1(d) : '–')+'</td></tr>';
    });
    h+='</tbody></table></div></div>';
  });
  return h;
}

document.getElementById('btnCopy').addEventListener('click',function(){
  if(!DS.length) return;
  var ds=DS[ACTIVE], rows=rowsOf(ds), rs=ratings(ds);
  var oi=CORE.overallIndex(rows,rs);
  var items=rs.map(function(m){return {m:m,st:CORE.stat(rows,m.col,m.scale)};}).filter(function(x){return x.st;})
              .sort(function(a,b){return b.st.index-a.st.index;});
  var L=[];
  L.push('YOUR OPINION MATTERS — '+ds.label);
  L.push(T('kResp')+': '+rows.length+(rows.length!==ds.rows.length? ' ('+T('ofResp',{a:rows.length,b:ds.rows.length})+')':''));
  L.push(T('kIndex')+': '+(oi?f1(oi.index):'–')+' / 100  ('+T('target')+': '+TARGET+')');
  var ins=insights(ds,rows);
  if(ins.length){
    L.push('');
    L.push(T('takeaways').toUpperCase());
    ins.forEach(function(x){ L.push('  · '+String(x.x).replace(/<[^>]+>/g,'')); });
  }
  L.push('');
  L.push(T('avgPerQ').toUpperCase()+' ('+T('sIndex').toLowerCase()+' 0-100 | '+T('sAvg').toLowerCase()+')');
  items.forEach(function(x){ L.push('  '+(' '+f0(x.st.index)).slice(-3)+'   '+f1(x.st.avg)+'/'+x.st.scale+'  '+x.m.short+'  (n='+x.st.n+', '+f0(x.st.low)+'% '+T('colCrit').toLowerCase()+')'); });
  [[countryCol(ds),T('tNat')],[ageCol(ds),T('tAge')],[matchMeta(ds,'__party'),T('dimParty')]].forEach(function(p){
    if(!p[0]) return;
    L.push(''); L.push((T('mIndex')+' — '+p[1]).toUpperCase()+' (min. '+MINN+')');
    var g=CORE.groupBy(rows,p[0].col,p[0].multi), lbl=valLabel(p[0]);
    Object.keys(g).filter(function(k){return g[k].length>=MINN;})
      .map(function(k){ var o=CORE.overallIndex(g[k],rs); return {k:k,v:o?o.index:null,n:g[k].length}; })
      .filter(function(x){return x.v!=null;}).sort(function(a,b){return b.v-a.v;})
      .forEach(function(x){ L.push('  '+f1(x.v)+'  '+lbl(x.k)+' (n='+x.n+')'); });
  });
  var txt=L.join('\n');
  navigator.clipboard.writeText(txt).then(function(){ toast(T('toastCopy')); },function(){
    var ta=document.createElement('textarea'); ta.value=txt; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); toast(T('toastCopy')); }catch(e){ toast(T('toastCopyErr')); }
    document.body.removeChild(ta);
  });
});
document.getElementById('btnCsv').addEventListener('click',function(){
  if(!DS.length) return;
  var ds=DS[ACTIVE], rows=rowsOf(ds), rs=ratings(ds);
  var head=['Dataset',T('colDim'),T('colSegment'),T('question'),T('sAvg'),T('scaleCol'),T('sIndex'),T('colResp'),T('sCrit'),T('sTop')];
  var lines=[head.join(';')];
  function push(dimName2,grp,rws){
    rs.forEach(function(m){
      var st=CORE.stat(rws,m.col,m.scale); if(!st) return;
      lines.push([ds.label,dimName2,grp,m.short,f1(st.avg),st.scale,f1(st.index),st.n,f0(st.low),f0(st.top)]
        .map(function(v){ return '"'+String(v).replace(/"/g,'""')+'"'; }).join(';'));
    });
  }
  push(T('total'),T('total'),rows);
  dims(ds).forEach(function(m){
    var g=CORE.groupBy(rows,m.col,m.multi), lbl=valLabel(m);
    Object.keys(g).forEach(function(k){ if(g[k].length>=MINN) push(dimName(m), lbl(k), g[k]); });
  });
  var blob=new Blob(['\ufeff'+lines.join('\n')],{type:'text/csv;charset=utf-8'});
  var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='opinion-matters-'+ds.label.replace(/[^\w-]+/g,'-').toLowerCase()+'.csv';
  a.click(); URL.revokeObjectURL(a.href);
  toast(T('toastCsv'));
});
